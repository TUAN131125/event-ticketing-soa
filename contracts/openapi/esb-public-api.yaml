openapi: 3.1.0
info:
  title: Booking ESB Public API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: >-
    Official v1 public baseline including the MAP-001 and RT-AUTH-001
    endpoint that issues a one-time Realtime WebSocket
    signed ticket. This endpoint is part of the official v1 baseline.
servers:
- url: https://api.example.com
security:
- bearerAuth: []
paths:
  /api/events:
    get:
      summary: Danh sách sự kiện
      operationId: publicListEvents
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicEvent'
      security: []
  /api/events/{eventId}:
    get:
      summary: Chi tiết sự kiện tổng hợp
      operationId: publicGetEvent
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      security: []
  /api/bookings:
    post:
      summary: Đặt vé
      operationId: placeBooking
      responses:
        '201':
          description: Đặt vé thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '202':
          description: Đang đối soát
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '402':
          description: Thanh toán bị từ chối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBookingRequest'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/TraceParent'
  /api/bookings/{bookingId}:
    get:
      summary: Lấy trạng thái booking
      operationId: publicGetBooking
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
  /api/bookings/{bookingId}/cancel:
    post:
      summary: Hủy booking
      operationId: publicCancelBooking
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/health:
    get:
      summary: Health tổng hợp
      operationId: aggregateHealth
      responses:
        '200':
          description: UP
          content:
            application/json:
              schema:
                type: object
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
  /api/traces/{correlationId}:
    get:
      summary: Tra workflow theo Correlation ID
      operationId: getWorkflowTrace
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TraceStep'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: correlationId
        in: path
        required: true
        schema:
          type: string
  /api/realtime/ws-tickets:
    post:
      operationId: issueRealtimeWebSocketTicket
      summary: Issue a short-lived one-time Realtime WebSocket ticket
      x-interface-class: public
      x-version: v1
      x-rate-limit-required: true
      description: >-
        Authenticates the browser JWT, takes only bookingId, calls Booking
        Service's authoritative access-decision operation, and fails closed on
        missing/inactive mapping, denial, timeout or dependency error. The
        browser must never submit customerId as ownership proof. The signed
        JWT/JWS ticket is returned only in the response body. It is issued by
        booking-orchestrator, bound to bookingId, verified identity subject,
        scope booking:status:read and Realtime audience, has a unique jti,
        expires within 60 seconds, is single-use and cannot be refreshed.
      security:
        - BrowserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequiredCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WsTicketRequest'}
      responses:
        '201':
          description: Signed single-use JWT/JWS ticket issued after an allowed Booking decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WsTicketResponse'}
              example:
                ticket: eyJhbGciOiJSUzI1NiJ9.eyJhdWQiOiJyZWFsdGltZS1zdGF0dXMtc2VydmljZSJ9.signature
                bookingId: BKG-001
                expiresAt: '2026-08-03T03:00:45Z'
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403':
          description: Booking access denied; no ticket issued.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '429':
          description: WS ticket issuance rate limit exceeded.
          headers:
            Retry-After: {schema: {type: integer, minimum: 1}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
components:
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    Money:
      $ref: '../common/money.schema.json'
    PageMeta:
      $ref: '../common/pagination.schema.json'
    SafeIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
    WsTicketRequest:
      type: object
      additionalProperties: false
      required: [bookingId]
      properties:
        bookingId: {$ref: '#/components/schemas/SafeIdentifier'}
    WsTicketResponse:
      type: object
      additionalProperties: false
      required: [ticket, bookingId, expiresAt]
      properties:
        ticket:
          type: string
          minLength: 16
          maxLength: 4096
          description: Signed compact JWT/JWS credential; never place in a URL or log it.
        bookingId: {$ref: '#/components/schemas/SafeIdentifier'}
        expiresAt: {type: string, format: date-time}
    SignedWebSocketTicketClaims:
      type: object
      additionalProperties: false
      description: Required signed JWT/JWS claims before compact serialization.
      required: [iss, aud, sub, bookingId, scope, iat, exp, jti]
      properties:
        iss: {type: string, const: booking-orchestrator}
        aud: {type: string, const: realtime-status-service}
        sub: {$ref: '#/components/schemas/SafeIdentifier'}
        bookingId: {$ref: '#/components/schemas/SafeIdentifier'}
        scope: {type: string, const: 'booking:status:read'}
        iat: {type: integer, format: int64, minimum: 0}
        exp: {type: integer, format: int64, minimum: 1}
        jti: {$ref: '#/components/schemas/SafeIdentifier'}
    WsTicketPolicy:
      type: object
      additionalProperties: false
      description: Non-wire policy assertions for every issued ticket.
      required:
        - audience
        - maximumTtlSeconds
        - singleUse
        - jtiRequired
        - refreshable
        - bookingBound
        - identitySubjectBound
        - signed
        - issuer
        - scope
        - requiredClaims
      properties:
        audience: {type: string, const: realtime-status-service}
        maximumTtlSeconds: {type: integer, const: 60, maximum: 60}
        singleUse: {type: boolean, const: true}
        jtiRequired: {type: boolean, const: true}
        refreshable: {type: boolean, const: false}
        bookingBound: {type: boolean, const: true}
        identitySubjectBound: {type: boolean, const: true}
        signed: {type: boolean, const: true}
        issuer: {type: string, const: booking-orchestrator}
        scope: {type: string, const: 'booking:status:read'}
        requiredClaims:
          type: array
          const: [iss, aud, sub, bookingId, scope, iat, exp, jti]
    PublicEvent:
      type: object
      required:
      - eventId
      - name
      - venue
      - startsAt
      - status
      - ticketTypes
      properties:
        eventId:
          type: string
        name:
          type: string
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
        status:
          type: string
        ticketTypes:
          type: array
          items:
            type: object
    PlaceBookingRequest:
      type: object
      additionalProperties: false
      required:
      - customerId
      - eventId
      - seatIds
      - paymentMethodToken
      properties:
        customerId:
          type: string
        eventId:
          type: string
        seatIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
        paymentMethodToken:
          type: string
          minLength: 6
    BookingResult:
      type: object
      additionalProperties: false
      required:
      - bookingId
      - status
      - total
      - correlationId
      properties:
        bookingId:
          type: string
        status:
          type: string
        total:
          $ref: '#/components/schemas/Money'
        reservationId:
          type:
          - string
          - 'null'
        paymentId:
          type:
          - string
          - 'null'
        ticketIds:
          type: array
          items:
            type: string
        correlationId:
          type: string
    TraceStep:
      type: object
      properties:
        service:
          type: string
        operation:
          type: string
        status:
          type: string
        durationMs:
          type: integer
        errorCode:
          type:
          - string
          - 'null'
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 64
    RequiredCorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái hoặc idempotency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Dữ liệu đúng cú pháp nhưng sai nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency hoặc service không sẵn sàng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    BrowserBearerAuth:
      $ref: '../common/openapi-security.yaml#/components/securitySchemes/BrowserBearerAuth'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
