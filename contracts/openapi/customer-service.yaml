openapi: 3.1.0
info:
  title: Customer Service API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: >-
    Official v1 baseline including the MAP-001 internal mapping
    extension. Customer Service is authoritative for identitySubject-to-customerId
    mappings. These internal operations are part of the official v1 baseline.
servers:
- url: http://customer-service:8001
security:
- bearerAuth: []
paths:
  /customers:
    post:
      summary: Tạo hồ sơ khách hàng
      operationId: createCustomer
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerCreate'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
  /customers/{customerId}:
    get:
      summary: Lấy chi tiết khách hàng
      operationId: getCustomer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CorrelationId'
    put:
      summary: Cập nhật hồ sơ
      operationId: replaceCustomer
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdate'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /customers:lookup:
    get:
      summary: Tìm theo email/điện thoại
      operationId: lookupCustomer
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
          format: email
      - name: phone
        in: query
        required: false
        schema:
          type: string
  /customers/{customerId}/consents:
    post:
      summary: Cập nhật consent
      operationId: updateCustomerConsent
      responses:
        '204':
          description: Đã cập nhật
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentUpdate'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
  /customers/{customerId}/deactivate:
    post:
      summary: Vô hiệu hóa khách hàng
      operationId: deactivateCustomer
      responses:
        '200':
          description: Đã vô hiệu hóa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /internal/customers/{customerId}/identity-link:
    put:
      operationId: linkCustomerIdentitySubject
      summary: Create or idempotently confirm an Identity-to-Customer mapping
      x-interface-class: internal
      x-version: v1
      description: >-
        Customer Service is authoritative for the one-to-one active mapping.
        The same identitySubject or customerId cannot have another active
        mapping. Browser callers are forbidden and no contact/profile PII is
        returned. Re-linking the same pair with the same Idempotency-Key is safe.
      security:
        - InternalServiceJwt: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/SafeIdentifier'}
        - $ref: '#/components/parameters/RequiredCorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityLinkRequest'}
      responses:
        '200':
          description: Mapping linked or idempotently confirmed.
          headers:
            ETag: {schema: {type: string, pattern: '^"[0-9]+"$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityMapping'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: >-
            IDENTITY_SUBJECT_ALREADY_LINKED, CUSTOMER_ALREADY_LINKED or
            IDEMPOTENCY_KEY_REUSED.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    delete:
      operationId: unlinkCustomerIdentitySubject
      summary: Versioned unlink preserving audit history
      x-interface-class: internal
      x-version: v1
      description: >-
        Marks the mapping UNLINKED without deleting audit evidence. Concurrent
        changes fail via If-Match. Browser callers are forbidden.
      security:
        - InternalServiceJwt: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/SafeIdentifier'}
        - $ref: '#/components/parameters/RequiredCorrelationId'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Mapping is now UNLINKED.
          headers:
            ETag: {schema: {type: string, pattern: '^"[0-9]+"$'}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityMapping'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /internal/identity-mappings/{identitySubject}:
    get:
      operationId: resolveCustomerIdentityMapping
      summary: Resolve an Identity subject to a non-PII Customer mapping
      x-interface-class: internal
      x-version: v1
      description: >-
        Returns ACTIVE, INACTIVE or UNLINKED mapping state without profile or
        contact PII. Customer deactivation retains the mapping but returns
        INACTIVE. Missing mapping returns 404. Timeout or dependency failure is
        an error and every downstream ownership decision must fail closed.
      security:
        - InternalServiceJwt: []
      parameters:
        - name: identitySubject
          in: path
          required: true
          schema: {$ref: '#/components/schemas/SafeIdentifier'}
        - $ref: '#/components/parameters/RequiredCorrelationId'
      responses:
        '200':
          description: Mapping resolved, including inactive/unlinked audit state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityMapping'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: IDENTITY_MAPPING_NOT_FOUND.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /health/live:
    get:
      summary: Liveness
      operationId: customerLiveness
      responses:
        '200':
          description: UP
      security: []
  /health/ready:
    get:
      summary: Readiness
      operationId: customerReadiness
      responses:
        '200':
          description: READY
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
components:
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    Money:
      $ref: '../common/money.schema.json'
    PageMeta:
      $ref: '../common/pagination.schema.json'
    SafeIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
    IdentityLinkRequest:
      type: object
      additionalProperties: false
      required: [identitySubject]
      properties:
        identitySubject: {$ref: '#/components/schemas/SafeIdentifier'}
    IdentityMapping:
      type: object
      additionalProperties: false
      description: Mapping metadata only; email, phone, name and profile fields are forbidden.
      required: [identitySubject, customerId, status, resourceVersion, linkedAt, updatedAt]
      properties:
        identitySubject: {$ref: '#/components/schemas/SafeIdentifier'}
        customerId: {$ref: '#/components/schemas/SafeIdentifier'}
        status: {type: string, enum: [ACTIVE, INACTIVE, UNLINKED]}
        resourceVersion: {type: integer, minimum: 1}
        linkedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    CustomerCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type:
          - string
          - 'null'
          maxLength: 30
    CustomerUpdate:
      type: object
      additionalProperties: false
      required:
      - name
      - email
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type:
          - string
          - 'null'
    Customer:
      type: object
      additionalProperties: false
      required:
      - customerId
      - name
      - email
      - status
      - resourceVersion
      - createdAt
      - updatedAt
      properties:
        customerId:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
          - string
          - 'null'
        status:
          enum:
          - ACTIVE
          - INACTIVE
          - ANONYMIZED
        resourceVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ConsentUpdate:
      type: object
      additionalProperties: false
      required:
      - channel
      - granted
      properties:
        channel:
          enum:
          - EMAIL
          - SMS
        granted:
          type: boolean
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 64
    RequiredCorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái hoặc idempotency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Dữ liệu đúng cú pháp nhưng sai nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency hoặc service không sẵn sàng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    InternalServiceJwt:
      $ref: '../common/openapi-security.yaml#/components/securitySchemes/InternalServiceJwt'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
