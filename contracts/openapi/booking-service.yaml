openapi: 3.1.0
info:
  title: Booking Service
  version: 1.0.0
  description: >-
    Internal API for the authoritative booking aggregate. Seat reservation,
    payment and ticket issuance are coordinated by Booking Orchestrator.
servers:
  - url: http://booking-service:8000
security:
  - serviceToken: []
paths:
  /bookings:
    post:
      operationId: createBooking
      summary: Create a pending booking from a validated reservation snapshot
      parameters:
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          description: Booking created or an identical completed result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          $ref: '#/components/responses/Error'
    get:
      operationId: listBookings
      summary: List authoritative bookings
      parameters:
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: customerId
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: eventId
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/BookingStatus'}
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Page of bookings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        default:
          $ref: '#/components/responses/Error'
  /bookings/{bookingId}:
    get:
      operationId: getBooking
      summary: Get one booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Booking found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          $ref: '#/components/responses/Error'
  /bookings/{bookingId}/confirm:
    post:
      operationId: confirmBooking
      summary: Mark a pending booking as confirmed after successful payment
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmBookingRequest'
      responses:
        '200':
          description: Confirmed booking or an identical completed result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          $ref: '#/components/responses/Error'
  /bookings/{bookingId}/fail:
    post:
      operationId: failBooking
      summary: Mark a pending booking as failed
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FailBookingRequest'
      responses:
        '200':
          description: Failed booking or an identical completed result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          $ref: '#/components/responses/Error'
  /bookings/{bookingId}/cancel:
    post:
      operationId: cancelBooking
      summary: Cancel a pending booking or a refunded confirmed booking
      parameters:
        - $ref: '#/components/parameters/BookingId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelBookingRequest'
      responses:
        '200':
          description: Cancelled booking or an identical completed result replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CallerService:
      name: X-Caller-Service
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ActorId:
      name: X-Actor-ID
      in: header
      required: false
      schema: {$ref: '#/components/schemas/Identifier'}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {$ref: '#/components/schemas/Identifier'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
  responses:
    Error:
      description: Stable error envelope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Identifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    Money:
      oneOf:
        - type: number
          minimum: 0
          multipleOf: 0.01
        - type: string
          pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$'
    BookingStatus:
      type: string
      enum: [PENDING, CONFIRMED, FAILED, CANCELLED]
    PaymentStatus:
      type: string
      enum: [PENDING, SUCCEEDED, FAILED, REFUNDED]
    BookingItem:
      type: object
      additionalProperties: false
      required: [seatId, ticketType, unitPrice]
      properties:
        seatId: {$ref: '#/components/schemas/Identifier'}
        ticketType: {$ref: '#/components/schemas/Identifier'}
        unitPrice: {$ref: '#/components/schemas/Money'}
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required:
        - customerId
        - eventId
        - reservationId
        - paymentMethod
        - items
        - totalAmount
        - currency
      properties:
        customerId: {$ref: '#/components/schemas/Identifier'}
        eventId: {$ref: '#/components/schemas/Identifier'}
        reservationId: {$ref: '#/components/schemas/Identifier'}
        paymentMethod:
          type: string
          minLength: 1
          maxLength: 40
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/BookingItem'}
        totalAmount: {$ref: '#/components/schemas/Money'}
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
    ConfirmBookingRequest:
      type: object
      additionalProperties: false
      required: [paymentId, expectedVersion]
      properties:
        paymentId: {$ref: '#/components/schemas/Identifier'}
        expectedVersion: {type: integer, minimum: 1}
    FailBookingRequest:
      type: object
      additionalProperties: false
      required: [failureCode, reason, expectedVersion]
      properties:
        failureCode: {$ref: '#/components/schemas/Identifier'}
        reason: {type: string, minLength: 1, maxLength: 2000}
        expectedVersion: {type: integer, minimum: 1}
    CancelBookingRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        expectedVersion: {type: integer, minimum: 1}
        paymentStatus:
          oneOf:
            - $ref: '#/components/schemas/PaymentStatus'
            - type: 'null'
    Booking:
      type: object
      additionalProperties: false
      required:
        - id
        - bookingId
        - customerId
        - eventId
        - reservationId
        - paymentMethod
        - items
        - seats
        - total
        - totalAmount
        - currency
        - status
        - paymentStatus
        - resourceVersion
        - createdAt
        - updatedAt
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        bookingId: {$ref: '#/components/schemas/Identifier'}
        customerId: {$ref: '#/components/schemas/Identifier'}
        eventId: {$ref: '#/components/schemas/Identifier'}
        reservationId: {$ref: '#/components/schemas/Identifier'}
        paymentMethod: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/BookingItem'}
        seats:
          type: array
          items: {$ref: '#/components/schemas/Identifier'}
        total: {$ref: '#/components/schemas/Money'}
        totalAmount: {$ref: '#/components/schemas/Money'}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        status: {$ref: '#/components/schemas/BookingStatus'}
        paymentStatus: {$ref: '#/components/schemas/PaymentStatus'}
        paymentId:
          oneOf:
            - $ref: '#/components/schemas/Identifier'
            - type: 'null'
        failureCode: {type: [string, 'null']}
        failureReason: {type: [string, 'null']}
        cancellationReason: {type: [string, 'null']}
        resourceVersion: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        confirmedAt: {type: [string, 'null'], format: date-time}
        cancelledAt: {type: [string, 'null'], format: date-time}
    BookingPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Booking'}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 1}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [correlationId, error]
      properties:
        correlationId: {type: string}
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, details]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            details: {type: object}
