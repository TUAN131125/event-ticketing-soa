openapi: 3.1.0
info:
  title: Booking Service API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: Baseline Giai đoạn 5 — hệ thống đặt vé sự kiện SOA/ESB.
servers:
- url: http://booking-service:8004
security:
- bearerAuth: []
paths:
  /bookings:
    post:
      summary: Tạo booking
      operationId: createBooking
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreate'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /bookings/{bookingId}:
    get:
      summary: Lấy booking
      operationId: getBooking
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
  /customers/{customerId}/bookings:
    get:
      summary: Lịch sử booking
      operationId: listCustomerBookings
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '403':
          $ref: '#/components/responses/Forbidden'
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
  /health/live:
    get:
      summary: Liveness
      operationId: bookingLiveness
      responses:
        '200':
          description: UP
      security: []
  /health/ready:
    get:
      summary: Readiness
      operationId: bookingReadiness
      responses:
        '200':
          description: READY
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
  /bookings/{bookingId}/reservation:
    post:
      summary: 'Chuyển trạng thái: reservation'
      operationId: bookingReservation
      description: PENDING → SEAT_RESERVED. Requires reservationId and verified reservation evidence.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [reservationId, evidence]
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /bookings/{bookingId}/payment-started:
    post:
      summary: 'Chuyển trạng thái: payment-started'
      operationId: bookingPaymentStarted
      description: SEAT_RESERVED → PAYMENT_PROCESSING. Requires a stable paymentId.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [paymentId]
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /bookings/{bookingId}/payment-result:
    post:
      summary: 'Chuyển trạng thái: payment-result'
      operationId: bookingPaymentResult
      description: >-
        Records verified CAPTURED, FAILED or UNKNOWN payment evidence while the
        booking remains PAYMENT_PROCESSING; it never confirms the booking by itself.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [paymentId, paymentStatus, evidence]
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /bookings/{bookingId}/tickets:
    post:
      summary: 'Chuyển trạng thái: tickets'
      operationId: bookingTickets
      description: Records issued ticket identifiers as evidence while PAYMENT_PROCESSING.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [ticketIds, evidence]
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /bookings/{bookingId}/confirm:
    post:
      summary: 'Chuyển trạng thái: confirm'
      operationId: bookingConfirm
      description: >-
        PAYMENT_PROCESSING → CONFIRMED only when seat confirmation, captured
        payment and issued-ticket evidence are all verified.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [reservationId, paymentId, paymentStatus, ticketIds, evidence]
                properties:
                  paymentStatus:
                    const: CAPTURED
                  evidence:
                    $ref: '#/components/schemas/ConfirmationEvidence'
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /bookings/{bookingId}/fail:
    post:
      summary: 'Chuyển trạng thái: fail'
      operationId: bookingFail
      description: >-
        PENDING, SEAT_RESERVED or PAYMENT_PROCESSING → FAILED with a reason,
        failure evidence and explicit compensation status/evidence.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [reasonCode, evidence, compensationStatus]
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /bookings/{bookingId}/cancel:
    post:
      summary: 'Chuyển trạng thái: cancel'
      operationId: bookingCancel
      description: >-
        A cancellable booking becomes CANCELLED when compensation is complete,
        otherwise COMPENSATION_PENDING until refund/release/ticket evidence completes.
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/TransitionCommand'
              - required: [reasonCode, evidence, compensationStatus]
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /internal/bookings/{bookingId}/access-decisions:
    post:
      operationId: decideBookingResourceAccess
      summary: Authoritatively decide whether a principal may access a booking
      x-interface-class: internal
      x-version: v1
      x-allowed-callers:
        - booking-orchestrator
      x-end-user-context-source: verified-browser-jwt
      x-role-assertion-policy: caller-must-not-elevate
      x-failure-policy: deny
      x-cache-max-age-seconds: 5
      description: >-
        Only ESB/Booking Orchestrator may call this operation. Booking Service
        owns this resource access decision. identitySubject and roles must come
        from a verified Browser JWT; the caller must not synthesize or elevate
        roles. It resolves the
        identitySubject through Customer Service and compares authoritative
        booking ownership internally; callers must not compare IDs themselves.
        ADMIN is the only role allowed to override ownership. Missing or
        inactive mapping, booking absence, timeout and dependency error all
        return allowed=false. Responses contain no customer profile or internal
        booking details and must not be cached longer than cacheTtlSeconds.
      security:
        - InternalServiceJwt: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: {$ref: '#/components/schemas/SafeIdentifier'}
        - $ref: '#/components/parameters/RequiredCorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BookingAccessDecisionRequest'}
      responses:
        '200':
          description: Authoritative allow or fail-closed deny decision.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BookingAccessDecision'}
              examples:
                owner:
                  value: {allowed: true, reasonCode: OWNER, cacheTtlSeconds: 5}
                dependencyFailure:
                  value: {allowed: false, reasonCode: DEPENDENCY_UNAVAILABLE, cacheTtlSeconds: 0}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '503':
          description: >-
            Transport-level dependency failure. Callers must treat this as deny;
            no access is granted without an allowed=true response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
components:
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    Money:
      $ref: '../common/money.schema.json'
    PageMeta:
      $ref: '../common/pagination.schema.json'
    SafeIdentifier:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
    BookingAccessDecisionRequest:
      type: object
      additionalProperties: false
      required: [identitySubject, roles]
      properties:
        identitySubject: {$ref: '#/components/schemas/SafeIdentifier'}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CUSTOMER, ADMIN, CHECKIN_STAFF, SERVICE]
    BookingAccessDecision:
      type: object
      additionalProperties: false
      required: [allowed, reasonCode, cacheTtlSeconds]
      properties:
        allowed: {type: boolean}
        reasonCode:
          type: string
          enum:
            - OWNER
            - ADMIN_OVERRIDE
            - BOOKING_NOT_FOUND
            - IDENTITY_NOT_MAPPED
            - CUSTOMER_INACTIVE
            - NOT_OWNER
            - DEPENDENCY_UNAVAILABLE
        cacheTtlSeconds: {type: integer, minimum: 0, maximum: 5}
    BookingCreate:
      type: object
      additionalProperties: false
      required:
      - customerId
      - eventId
      - items
      properties:
        customerId:
          type: string
        eventId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - seatId
            - ticketTypeCode
            - unitPrice
            properties:
              seatId:
                type: string
              ticketTypeCode:
                type: string
              unitPrice:
                $ref: '#/components/schemas/Money'
    Booking:
      type: object
      additionalProperties: false
      required:
      - bookingId
      - customerId
      - eventId
      - status
      - items
      - total
      - resourceVersion
      - createdAt
      - updatedAt
      properties:
        bookingId:
          type: string
        customerId:
          type: string
        eventId:
          type: string
        status:
          enum:
          - PENDING
          - SEAT_RESERVED
          - PAYMENT_PROCESSING
          - CONFIRMED
          - FAILED
          - CANCELLED
          - COMPENSATION_PENDING
        items:
          type: array
          items:
            type: object
        total:
          $ref: '#/components/schemas/Money'
        reservationId:
          type:
          - string
          - 'null'
        paymentId:
          type:
          - string
          - 'null'
        ticketIds:
          type: array
          items:
            type: string
        resourceVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TransitionCommand:
      type: object
      additionalProperties: false
      properties:
        reservationId:
          type: string
        paymentId:
          type: string
        paymentStatus:
          type: string
          enum: [CAPTURED, FAILED, UNKNOWN]
        ticketIds:
          type: array
          items:
            type: string
        reasonCode:
          type: string
        compensationStatus:
          type: string
          enum: [NOT_REQUIRED, COMPLETED, PENDING]
        evidence:
          $ref: '#/components/schemas/TransitionEvidence'
    TransitionEvidence:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        providerReference:
          type: string
        reservationExpiresAt:
          type: string
          format: date-time
        seatConfirmed:
          type: boolean
        paymentCaptured:
          type: boolean
        ticketsIssued:
          type: boolean
        compensationCompleted:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
    ConfirmationEvidence:
      allOf:
      - $ref: '#/components/schemas/TransitionEvidence'
      - required: [seatConfirmed, paymentCaptured, ticketsIssued, verifiedAt]
        properties:
          seatConfirmed:
            const: true
          paymentCaptured:
            const: true
          ticketsIssued:
            const: true
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 64
    RequiredCorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 64
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái hoặc idempotency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Dữ liệu đúng cú pháp nhưng sai nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency hoặc service không sẵn sàng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    InternalServiceJwt:
      $ref: '../common/openapi-security.yaml#/components/securitySchemes/InternalServiceJwt'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
