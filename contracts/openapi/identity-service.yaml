openapi: 3.1.0
info:
  title: Identity and Access Service
  version: 1.0.0
  description: >-
    Official v1 Identity contract reviewed from the current service-local
    Identity contract and runtime. Identity owns accounts, credentials, roles,
    refresh sessions and signing keys. It does not own or expose the
    identitySubject-to-customerId mapping and never issues an authoritative
    customerId claim.
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
servers:
  - url: http://identity-service:8009
paths:
  /auth/register:
    post:
      operationId: registerIdentityAccount
      x-interface-class: public
      x-version: v1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /auth/login:
    post:
      operationId: loginIdentityAccount
      x-interface-class: public
      x-version: v1
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access JWT and refresh-session metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /auth/refresh:
    post:
      operationId: refreshIdentitySession
      x-interface-class: public
      x-version: v1
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Refresh token rotated and a new access JWT issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/logout:
    post:
      operationId: logoutIdentitySession
      x-interface-class: public
      x-version: v1
      security:
        - RefreshCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Refresh-token family revoked or already absent.
        '403': {$ref: '#/components/responses/Forbidden'}
  /auth/me:
    get:
      operationId: getCurrentIdentityPrincipal
      x-interface-class: public
      x-version: v1
      security:
        - UserBearerAuth: []
      responses:
        '200':
          description: Current Identity account and roles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': {$ref: '#/components/responses/Unauthorized'}
  /admin/users/{userId}/roles:
    post:
      operationId: changeIdentityUserRole
      x-interface-class: public
      x-version: v1
      description: Existing ADMIN-only role assignment/revocation capability.
      security:
        - UserBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeRequest'
      responses:
        '200':
          description: Role mutation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangeResponse'
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
  /.well-known/jwks.json:
    get:
      operationId: getIdentityJwks
      x-interface-class: public
      x-version: v1
      security: []
      responses:
        '200':
          description: Public JSON Web Key Set for access JWT verification.
          content:
            application/jwk-set+json:
              schema:
                $ref: '#/components/schemas/JwkSet'
components:
  securitySchemes:
    UserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Identity user JWT validated using the canonical claims schema.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: identity_refresh
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 320}
        password: {type: string, format: password, minLength: 12, maxLength: 128}
    LoginRequest:
      $ref: '#/components/schemas/RegisterRequest'
    Role:
      type: string
      enum: [CUSTOMER, ADMIN, CHECKIN_STAFF, SERVICE]
    RoleChangeRequest:
      type: object
      additionalProperties: false
      required: [role, action]
      properties:
        role: {$ref: '#/components/schemas/Role'}
        action: {type: string, enum: [ASSIGN, REVOKE]}
    User:
      type: object
      additionalProperties: false
      required: [userId, email, status, roles, tokenVersion, createdAt]
      properties:
        userId: {type: string, format: uuid}
        email: {type: string, format: email, maxLength: 320}
        status: {type: string, enum: [ACTIVE, DISABLED]}
        roles:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/Role'}
        tokenVersion: {type: integer, minimum: 1}
        createdAt: {type: string, format: date-time}
    AccessTokenClaims:
      type: object
      additionalProperties: false
      description: >-
        Canonical claims proven by current Identity implementation. customerId
        is intentionally absent and must never be treated as authoritative.
      required: [sub, roles, tokenVersion, iss, aud, iat, exp]
      properties:
        sub: {type: string, minLength: 1, maxLength: 128}
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/Role'}
        tokenVersion: {type: integer, minimum: 1}
        iss: {type: string, minLength: 1, maxLength: 256}
        aud:
          oneOf:
            - {type: string, minLength: 1, maxLength: 256}
            - type: array
              minItems: 1
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 256}
        iat: {type: integer}
        exp: {type: integer}
        nbf: {type: integer}
        jti: {type: string, minLength: 1, maxLength: 128}
    TokenResponse:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresIn, csrfToken, user]
      properties:
        accessToken:
          type: string
          minLength: 1
          readOnly: true
          x-jwt-claims: {$ref: '#/components/schemas/AccessTokenClaims'}
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 1}
        csrfToken: {type: string, minLength: 32, readOnly: true}
        user: {$ref: '#/components/schemas/User'}
    RoleChangeResponse:
      type: object
      additionalProperties: false
      required: [user, role, action, changed]
      properties:
        user: {$ref: '#/components/schemas/User'}
        role: {$ref: '#/components/schemas/Role'}
        action: {type: string, enum: [ASSIGN, REVOKE]}
        changed: {type: boolean}
    JwkSet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kty, use, alg, kid, n, e]
            properties:
              kty: {type: string, const: RSA}
              use: {type: string, const: sig}
              alg: {type: string, const: RS256}
              kid: {type: string, minLength: 1}
              n: {type: string, minLength: 1}
              e: {type: string, minLength: 1}
  responses:
    BadRequest:
      description: Invalid request.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unauthorized:
      description: Authentication failed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Forbidden:
      description: Permission denied or account disabled.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotFound:
      description: Identity resource not found.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: Identity uniqueness conflict.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Unprocessable:
      description: Request violates validation or domain rules.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: Authentication rate limit exceeded.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
