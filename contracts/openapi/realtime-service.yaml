openapi: 3.1.0
info:
  title: Realtime Status Service HTTP API
  version: 1.0.0
  description: >-
    Candidate HTTP integration baseline for internal status ingestion and
    aggregate connection health. Realtime is a best-effort projection and is
    never authoritative for booking state. Internal producer authentication is
    the RT-AUTH-001 short-lived service JWT contract. Browser access uses the
    ESB-issued signed one-time JWT/JWS WebSocket ticket protocol; Realtime never accepts a
    browser-provided customerId or a long-lived access token in the URL.
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
servers:
  - url: http://realtime-status-service:8008
paths:
  /internal/status-events:
    post:
      operationId: ingestRealtimeStatusEvent
      summary: Accept a booking status projection from an internal producer
      x-interface-class: internal
      x-version: v1
      description: >-
        Accepts a non-authoritative status projection for best-effort broadcast.
        messageId is the deduplication identity and sequence is monotonic per
        bookingId. Duplicate or stale input is not broadcast again. The caller
        presents a short-lived signed service JWT whose iss, sub, aud, iat, exp
        and jti are verified. aud must identify Realtime Status Service, sub must
        be allow-listed and replayed jti values are rejected. Browser JWTs are
        forbidden; deployment mTLS may supplement but not replace this contract.
      x-service-jwt-policy:
        requiredClaims: [iss, sub, aud, iat, exp, jti]
        audience: realtime-status-service
        shortLived: true
        callerAllowListRequired: true
        replayedJtiRejected: true
        browserJwtAccepted: false
      security:
        - InternalServiceJwt: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../websocket/realtime-status/status-message.schema.json'
      responses:
        '202':
          description: New event accepted for best-effort publication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEventResult'
              example:
                outcome: ACCEPTED
                messageId: MSG-001
                bookingId: BKG-001
                sequence: 3
                correlationId: corr-1234567890abcdef
        '200':
          description: Valid event identified as duplicate or stale and not broadcast.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusEventResult'
              examples:
                duplicate:
                  value:
                    outcome: DUPLICATE
                    messageId: MSG-001
                    bookingId: BKG-001
                    sequence: 3
                    correlationId: corr-1234567890abcdef
                stale:
                  value:
                    outcome: STALE
                    messageId: MSG-002
                    bookingId: BKG-001
                    sequence: 2
                    correlationId: corr-1234567890abcdef
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid status, sequence, timestamp or identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Temporary broadcast backend failure; booking processing is unaffected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /connections/health:
    get:
      operationId: getConnectionHealth
      summary: Read non-sensitive aggregate connection health
      x-interface-class: internal
      x-version: v1
      description: >-
        Returns only aggregate connection and backend readiness information.
        It never returns tokens, booking subscription identifiers, customer
        identifiers, user identifiers or message content.
      security:
        - InternalServiceJwt: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Aggregate connection health.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionHealth'
              example:
                status: UP
                activeConnections: 12
                activeBookingChannels: 5
                broadcastBackend: memory
                backendAvailable: true
                draining: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    InternalServiceJwt:
      $ref: '../common/openapi-security.yaml#/components/securitySchemes/InternalServiceJwt'
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    StatusEventResult:
      type: object
      additionalProperties: false
      required: [outcome, messageId, bookingId, sequence, correlationId]
      properties:
        outcome:
          type: string
          enum: [ACCEPTED, DUPLICATE, STALE]
        messageId:
          type: string
          minLength: 1
          maxLength: 128
        bookingId:
          type: string
          minLength: 1
          maxLength: 128
        sequence:
          type: integer
          minimum: 1
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
    ConnectionHealth:
      type: object
      additionalProperties: false
      required:
        - status
        - activeConnections
        - activeBookingChannels
        - broadcastBackend
        - backendAvailable
        - draining
      properties:
        status:
          type: string
          enum: [UP, DEGRADED]
        activeConnections:
          type: integer
          minimum: 0
        activeBookingChannels:
          type: integer
          minimum: 0
        broadcastBackend:
          type: string
          enum: [memory, redis]
        backendAvailable:
          type: boolean
        draining:
          type: boolean
  responses:
    BadRequest:
      description: Malformed request or correlation metadata.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Internal producer could not be authenticated.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated caller is not authorized by the deferred caller policy.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Realtime or its required backend is unavailable; booking remains unaffected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
