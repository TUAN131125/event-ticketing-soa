openapi: 3.1.0
info:
  title: Ticket Service API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: Baseline Giai đoạn 5 — hệ thống đặt vé sự kiện SOA/ESB.
servers:
- url: http://ticket-service:8006
security:
- bearerAuth: []
paths:
  /tickets:issue:
    post:
      summary: Phát hành vé
      operationId: issueTickets
      responses:
        '201':
          description: Đã phát hành
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIssue'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /tickets/{ticketId}:
    get:
      summary: Lấy vé
      operationId: getTicket
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
  /bookings/{bookingId}/tickets:
    get:
      summary: Liệt kê vé theo booking
      operationId: listBookingTickets
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
  /tickets/validate:
    post:
      summary: Xác thực QR
      operationId: validateTicket
      responses:
        '200':
          description: Kết quả
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketValidate'
  /tickets/{ticketId}/check-in:
    post:
      summary: Check-in
      operationId: checkInTicket
      responses:
        '200':
          description: Đã check-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /tickets/{ticketId}/cancel:
    post:
      summary: Hủy vé
      operationId: cancelTicket
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /tickets/{ticketId}/reissue-qr:
    post:
      summary: Cấp lại QR
      operationId: reissueQr
      responses:
        '200':
          description: Đã cấp lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /health/live:
    get:
      summary: Liveness
      operationId: ticketLiveness
      responses:
        '200':
          description: UP
      security: []
  /health/ready:
    get:
      summary: Readiness
      operationId: ticketReadiness
      responses:
        '200':
          description: READY
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
components:
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    Money:
      $ref: '../common/money.schema.json'
    PageMeta:
      $ref: '../common/pagination.schema.json'
    TicketIssue:
      type: object
      additionalProperties: false
      required:
      - bookingId
      - eventId
      - customerId
      - items
      properties:
        bookingId:
          type: string
        eventId:
          type: string
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - seatId
            properties:
              seatId:
                type: string
    Ticket:
      type: object
      additionalProperties: false
      required:
      - ticketId
      - bookingId
      - eventId
      - customerId
      - seatId
      - status
      - resourceVersion
      properties:
        ticketId:
          type: string
        bookingId:
          type: string
        eventId:
          type: string
        customerId:
          type: string
        seatId:
          type: string
        status:
          enum:
          - ISSUED
          - CHECKED_IN
          - CANCELLED
        qrToken:
          type:
          - string
          - 'null'
          description: Chỉ trả cho owner; không ghi log.
        resourceVersion:
          type: integer
          minimum: 1
    TicketValidate:
      type: object
      additionalProperties: false
      required:
      - qrToken
      properties:
        qrToken:
          type: string
          minLength: 16
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 64
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái hoặc idempotency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Dữ liệu đúng cú pháp nhưng sai nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency hoặc service không sẵn sàng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
