openapi: 3.1.0
info:
  title: Ticket Service
  version: 1.0.0
  description: >-
    Internal API for atomic ticket issuance, versioned signed QR presentation,
    cancellation and role-gated venue check-in. One ticket represents one event seat.
servers:
  - url: http://ticket-service:8000
security:
  - serviceToken: []
paths:
  /tickets/issue:
    post:
      operationId: issueTickets
      summary: Atomically issue one ticket per confirmed booking seat
      parameters:
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRoles'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IssueTicketsRequest'}
      responses:
        '201':
          description: Complete ticket set created or identical result replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketBatch'}
        default: {$ref: '#/components/responses/Error'}
  /tickets:
    get:
      operationId: listTickets
      summary: List ticket summaries without embedding QR images
      parameters:
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRoles'
        - $ref: '#/components/parameters/CorrelationId'
        - name: page
          in: query
          schema: {type: integer, minimum: 1, default: 1}
        - name: pageSize
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: bookingId
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: customerId
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: eventId
          in: query
          schema: {$ref: '#/components/schemas/Identifier'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/TicketStatus'}
        - name: search
          in: query
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '200':
          description: Page of ticket summaries
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TicketPage'}
        default: {$ref: '#/components/responses/Error'}
  /tickets/{ticketId}:
    get:
      operationId: getTicket
      summary: Get ticket detail and current QR image when valid
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRoles'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ticket found
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        default: {$ref: '#/components/responses/Error'}
  /tickets/{ticketId}/cancel:
    post:
      operationId: cancelTicket
      summary: Cancel a valid, unused ticket
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRoles'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CancelTicketRequest'}
      responses:
        '200':
          description: Ticket cancelled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        default: {$ref: '#/components/responses/Error'}
  /tickets/{ticketId}/check-in:
    post:
      operationId: checkInTicket
      summary: Validate current signed QR and atomically check in the ticket
      description: Requires X-Actor-ID and CHECKIN_STAFF or ADMIN in X-Actor-Roles.
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRoles'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckInTicketRequest'}
      responses:
        '200':
          description: Ticket checked in or identical completed result replayed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        default: {$ref: '#/components/responses/Error'}
  /tickets/{ticketId}/qr/regenerate:
    post:
      operationId: regenerateTicketQr
      summary: Rotate QR version and immediately invalidate the old QR
      parameters:
        - $ref: '#/components/parameters/TicketId'
        - $ref: '#/components/parameters/CallerService'
        - $ref: '#/components/parameters/ActorId'
        - $ref: '#/components/parameters/ActorRoles'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RegenerateQrRequest'}
      responses:
        '200':
          description: QR rotated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Ticket'}
        default: {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Internal shared secret. Never expose QR signing material here.
  parameters:
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    CallerService:
      name: X-Caller-Service
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
    ActorId:
      name: X-Actor-ID
      in: header
      required: false
      schema: {$ref: '#/components/schemas/Identifier'}
    ActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      description: Comma-separated roles from the trusted identity boundary.
      schema: {type: string, maxLength: 256}
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema: {$ref: '#/components/schemas/Identifier'}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/Identifier'}
  responses:
    Error:
      description: Stable error envelope; inspect error.retryable before retrying
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
  schemas:
    Identifier:
      type: string
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    TicketStatus:
      type: string
      enum: [VALID, CHECKED_IN, CANCELLED]
    TicketDefinition:
      type: object
      additionalProperties: false
      required: [seatId, ticketType]
      properties:
        seatId: {$ref: '#/components/schemas/Identifier'}
        seatLabel:
          anyOf:
            - {$ref: '#/components/schemas/Identifier'}
            - {type: 'null'}
        ticketType: {$ref: '#/components/schemas/Identifier'}
    IssueTicketsRequest:
      type: object
      additionalProperties: false
      required: [bookingId, customerId, eventId, paymentId, tickets]
      properties:
        bookingId: {$ref: '#/components/schemas/Identifier'}
        customerId: {$ref: '#/components/schemas/Identifier'}
        eventId: {$ref: '#/components/schemas/Identifier'}
        paymentId: {$ref: '#/components/schemas/Identifier'}
        tickets:
          type: array
          minItems: 1
          maxItems: 50
          items: {$ref: '#/components/schemas/TicketDefinition'}
    CancelTicketRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason: {type: string, minLength: 1, maxLength: 2000}
        expectedVersion: {type: integer, minimum: 1}
    CheckInTicketRequest:
      type: object
      additionalProperties: false
      required: [qrToken, gateId, expectedVersion]
      properties:
        qrToken: {type: string, minLength: 1, maxLength: 256}
        gateId: {$ref: '#/components/schemas/Identifier'}
        expectedVersion: {type: integer, minimum: 1}
    RegenerateQrRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: {type: integer, minimum: 1}
    TicketFields:
      type: object
      required: [id, ticketId, bookingId, customerId, eventId, paymentId, seatId, seatLabel, ticketType, status, qrVersion, resourceVersion, issuedAt, updatedAt, checkedInAt, checkedInGateId, checkedInBy, cancelledAt, cancellationReason]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        ticketId: {$ref: '#/components/schemas/Identifier'}
        bookingId: {$ref: '#/components/schemas/Identifier'}
        customerId: {$ref: '#/components/schemas/Identifier'}
        eventId: {$ref: '#/components/schemas/Identifier'}
        paymentId: {$ref: '#/components/schemas/Identifier'}
        seatId: {$ref: '#/components/schemas/Identifier'}
        seatLabel: {$ref: '#/components/schemas/Identifier'}
        ticketType: {$ref: '#/components/schemas/Identifier'}
        status: {$ref: '#/components/schemas/TicketStatus'}
        qrVersion: {type: integer, minimum: 1}
        resourceVersion: {type: integer, minimum: 1}
        issuedAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        checkedInAt: {type: [string, 'null'], format: date-time}
        checkedInGateId: {type: [string, 'null']}
        checkedInBy: {type: [string, 'null']}
        cancelledAt: {type: [string, 'null'], format: date-time}
        cancellationReason: {type: [string, 'null']}
    TicketSummary:
      allOf:
        - {$ref: '#/components/schemas/TicketFields'}
      unevaluatedProperties: false
    Ticket:
      allOf:
        - {$ref: '#/components/schemas/TicketFields'}
        - type: object
          required: [qrCode]
          properties:
            qrCode:
              type: [string, 'null']
              description: SVG data URI containing only the signed opaque QR token.
      unevaluatedProperties: false
    TicketBatch:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Ticket'}}
    TicketPage:
      type: object
      additionalProperties: false
      required: [items, page, pageSize, total, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/TicketSummary'}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1, maximum: 100}
        total: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [correlationId, error]
      properties:
        correlationId: {type: string}
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable, details]
          properties:
            code: {type: string}
            message: {type: string}
            retryable: {type: boolean}
            details: {type: object, additionalProperties: true}
