openapi: 3.1.0
info:
  title: Payment Service API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: Baseline Giai đoạn 5 — hệ thống đặt vé sự kiện SOA/ESB.
servers:
- url: http://payment-service:8005
security:
- bearerAuth: []
paths:
  /payments:
    post:
      summary: Tạo payment
      operationId: createPayment
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
  /payments/{paymentId}:
    get:
      summary: Lấy trạng thái payment
      operationId: getPayment
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
  /payments/{paymentId}/authorize:
    post:
      summary: Authorize payment
      operationId: authorizePayment
      responses:
        '200':
          description: Đã authorize
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '402':
          description: Bị từ chối
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /payments/{paymentId}/capture:
    post:
      summary: Capture payment
      operationId: capturePayment
      responses:
        '200':
          description: Đã capture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /payments/{paymentId}/cancel:
    post:
      summary: Hủy payment
      operationId: cancelPayment
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /payments/{paymentId}/refunds:
    post:
      summary: Tạo refund
      operationId: createRefund
      responses:
        '201':
          description: Đã tạo refund
          content:
            application/json:
              schema:
                type: object
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundCreate'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
  /payments/provider-callback:
    post:
      summary: Callback provider giả lập
      operationId: receiveProviderCallback
      description: >-
        Signed provider callback. Provider event IDs are deduplicated and the
        timestamp is checked against the replay window.
      parameters:
      - name: X-Provider-Timestamp
        in: header
        required: true
        schema:
          type: string
          format: date-time
      - name: X-Provider-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: '^sha256=[A-Fa-f0-9]{64}$'
      responses:
        '204':
          description: Đã nhận
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCallback'
      security:
      - providerHmac: []
  /payments/{paymentId}/reconcile:
    post:
      summary: Đối soát payment
      operationId: reconcilePayment
      responses:
        '200':
          description: Đã đối soát
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
  /health/live:
    get:
      summary: Liveness
      operationId: paymentLiveness
      responses:
        '200':
          description: UP
      security: []
  /health/ready:
    get:
      summary: Readiness
      operationId: paymentReadiness
      responses:
        '200':
          description: READY
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      security: []
components:
  schemas:
    ErrorResponse:
      $ref: '../common/error-response.schema.json'
    Money:
      $ref: '../common/money.schema.json'
    PageMeta:
      $ref: '../common/pagination.schema.json'
    PaymentCreate:
      type: object
      additionalProperties: false
      required:
      - bookingId
      - amount
      - methodToken
      properties:
        bookingId:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        methodToken:
          type: string
          minLength: 6
          maxLength: 200
    Payment:
      type: object
      additionalProperties: false
      required:
      - paymentId
      - bookingId
      - amount
      - status
      - resourceVersion
      - createdAt
      - updatedAt
      properties:
        paymentId:
          type: string
        bookingId:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
        status:
          enum:
          - CREATED
          - AUTHORIZED
          - CAPTURED
          - FAILED
          - CANCELLED
          - UNKNOWN
          - PARTIALLY_REFUNDED
          - REFUNDED
        providerReference:
          type:
          - string
          - 'null'
        resourceVersion:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    RefundCreate:
      type: object
      additionalProperties: false
      required:
      - amount
      - reason
      properties:
        amount:
          $ref: '#/components/schemas/Money'
        reason:
          type: string
          maxLength: 300
    ProviderCallback:
      type: object
      additionalProperties: false
      required:
      - eventId
      - paymentId
      - providerStatus
      - occurredAt
      properties:
        eventId:
          type: string
        paymentId:
          type: string
        providerStatus:
          type: string
        occurredAt:
          type: string
          format: date-time
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 16
        maxLength: 64
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[0-9]+"$
  responses:
    BadRequest:
      description: Request không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Chưa xác thực
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Không đủ quyền
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Không tìm thấy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Xung đột trạng thái hoặc idempotency
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Dữ liệu đúng cú pháp nhưng sai nghiệp vụ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Dependency hoặc service không sẵn sàng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    providerHmac:
      type: apiKey
      in: header
      name: X-Provider-Signature
