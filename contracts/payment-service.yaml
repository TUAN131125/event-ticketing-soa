  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: corr-1234567890abcdef
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: idem-booking-12345678
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated principal is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency, uniqueness or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Request violates validation or domain rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service or required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match does not match the current ETag.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Identity user JWT; verify signature, iss, aud, exp, sub, roles and tokenVersion.
    providerHmac:
      type: apiKey
      in: header
      name: X-Provider-Signature
    ServiceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service JWT; verify iss, sub, aud, iat, exp and jti and reject replay.
    WebhookHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 over X-Webhook-Timestamp + '.' + the exact request body; reject stale timestamps.
  headers:
    ETag:
      description: Strong resource-version validator used by If-Match.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
