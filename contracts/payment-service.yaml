components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - correlationId
      - error
      properties:
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        traceId:
          type: string
          pattern: ^[A-Fa-f0-9]{16,32}$
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - retryable
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]{1,63}$
            message:
              type: string
              minLength: 1
              maxLength: 500
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
      example:
        correlationId: corr-1234567890abcdef
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        error:
          code: RESOURCE_CONFLICT
          message: The resource changed; reload and retry.
          retryable: false
          details:
            currentVersion: 3
    Money:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - currency
      properties:
        amountMinor:
          type: integer
          minimum: 0
          format: int64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      example:
        amountMinor: 250000
        currency: VND
    AuthorizePaymentRequest:
      additionalProperties: false
      properties:
        approved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Approved
        expectedVersion:
          anyOf:
          - minimum: 1.0
            type: integer
          - type: 'null'
          title: Expectedversion
        failureCode:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Failurecode
        providerReference:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Providerreference
        providerStatus:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
        reason:
          anyOf:
          - maxLength: 2000
            minLength: 1
            type: string
          - type: 'null'
          title: Reason
      title: AuthorizePaymentRequest
      type: object
    BookingPaymentEvidenceRequest:
      additionalProperties: false
      properties:
        amount:
          anyOf:
          - exclusiveMinimum: 0.0
            type: number
          - type: string
          - type: 'null'
          title: Amount
        amountMinor:
          anyOf:
          - exclusiveMinimum: 0.0
            type: integer
          - type: 'null'
