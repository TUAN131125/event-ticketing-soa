openapi: 3.1.0
info:
  title: Payment Service API
  version: 2.0.0
  description: Canonical internal contract for the Payment Service.
servers:
- url: http://localhost:8005
  description: Local contract endpoint; deployment host is supplied by configuration.
security:
- ServiceJwt: []
paths:
  /health/live:
    get:
      summary: Live
      operationId: paymentLiveness
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Paymentliveness
                type: object
          description: Successful Response
  /health/ready:
    get:
      summary: Ready
      operationId: paymentReadiness
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
  /payments:
    get:
      summary: List All
      operationId: listPayments
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      - in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          title: Page
          type: integer
      - in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Pagesize
          type: integer
      - in: query
        name: bookingId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookingid
      - in: query
        name: customerId
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Customerid
      - in: query
        name: provider
        required: false
        schema:
          anyOf:
          - maxLength: 40
            minLength: 1
            type: string
          - type: 'null'
          title: Provider
      - in: query
        name: status
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
          title: Status
      - in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Search
      - in: header
        name: X-Caller-Service
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - in: header
        name: X-Actor-ID
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageResponse'
          description: Successful Response
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      summary: Create
      operationId: createPayment
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      - in: header
