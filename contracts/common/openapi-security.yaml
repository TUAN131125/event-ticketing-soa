openapi: 3.1.0
info:
  title: Event Ticketing Common Security Schemes
  version: 1.0.0
  description: >-
    Canonical names and semantic requirements for user-facing ESB JWTs and
    internal service JWTs. This file defines contract semantics, not deployment
    key distribution or optional mTLS configuration.
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
paths: {}
components:
  securitySchemes:
    BrowserBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived user access JWT presented to the public ESB audience. The
        authoritative principal is sub plus roles. A customerId claim, if ever
        present, is only a hint and is never ownership proof. This scheme must
        not authenticate internal status producers.
      x-required-claims: [sub, roles, tokenVersion, iss, aud, iat, exp]
      x-audience: public-esb
      x-customer-id-authoritative: false
    InternalServiceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived signed JWT for service-to-service calls. The receiving
        service verifies issuer, subject/caller, audience, issued-at, expiry and
        jti; requires the caller in an operation-specific allow-list; and rejects
        replayed jti values. Browser access JWTs are not accepted. Deployment
        mTLS may supplement but does not replace these semantic requirements.
      x-required-claims: [iss, sub, aud, iat, exp, jti]
      x-short-lived: true
      x-audience-bound: true
      x-caller-allow-list-required: true
      x-jti-replay-protection: required
      x-browser-jwt-accepted: false
