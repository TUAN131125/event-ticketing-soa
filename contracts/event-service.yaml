openapi: 3.1.0
info:
  title: Event Service API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: Baseline Giai đoạn 5 — hệ thống đặt vé sự kiện SOA/ESB.
servers:
- url: http://localhost:8002
  description: Local contract endpoint; deployment host is supplied by configuration.
security:
- ServiceJwt: []
paths:
  /events:
    get:
      summary: Liệt kê sự kiện
      operationId: listEvents
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '500':
          $ref: '#/components/responses/InternalError'
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      security: []
    post:
      summary: Tạo sự kiện
      operationId: createEvent
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /events/{eventId}:
    get:
      summary: Chi tiết sự kiện
      operationId: getEvent
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      security: []
    put:
      summary: Thay thế sự kiện
      operationId: replaceEvent
      responses:
        '200':
          description: Đã cập nhật
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreate'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /events/{eventId}/publish:
    post:
      summary: Mở bán
      operationId: publishEvent
      responses:
        '200':
          description: Đã mở bán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /events/{eventId}/pause:
    post:
      summary: Tạm dừng bán
      operationId: pauseEvent
      responses:
        '200':
          description: Đã tạm dừng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /events/{eventId}/cancel:
    post:
      summary: Hủy sự kiện
      operationId: cancelEvent
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /events/{eventId}/sale-eligibility:
    get:
      summary: Kiểm tra điều kiện bán
      operationId: getSaleEligibility
      responses:
        '200':
          description: Kết quả
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleEligibility'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /health/live:
    get:
      operationId: eventLiveness
      summary: Process liveness probe
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /health/ready:
    get:
      operationId: eventReadiness
      summary: Dependency readiness probe
      security: []
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: READY
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - correlationId
      - error
      properties:
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        traceId:
          type: string
          pattern: ^[A-Fa-f0-9]{16,32}$
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - retryable
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]{1,63}$
            message:
              type: string
              minLength: 1
              maxLength: 500
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
      example:
        correlationId: corr-1234567890abcdef
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        error:
          code: RESOURCE_CONFLICT
          message: The resource changed; reload and retry.
          retryable: false
          details:
            currentVersion: 3
    Money:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - currency
      properties:
        amountMinor:
          type: integer
          minimum: 0
          format: int64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      example:
        amountMinor: 250000
        currency: VND
    PageMeta:
      $ref: '#/components/schemas/PageMeta'
    EventCreate:
      type: object
      additionalProperties: false
      required:
      - name
      - venue
      - startsAt
      - saleStartsAt
      - saleEndsAt
      - ticketTypes
      properties:
        name:
          type: string
          minLength: 2
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
          pattern: (?:Z|\+00:00)$
        saleStartsAt:
          type: string
          format: date-time
          pattern: (?:Z|\+00:00)$
        saleEndsAt:
          type: string
          format: date-time
          pattern: (?:Z|\+00:00)$
        ticketTypes:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required:
            - code
            - name
            - price
            properties:
              code:
                type: string
              name:
                type: string
              price:
                $ref: '#/components/schemas/Money'
    Event:
      type: object
      additionalProperties: false
      required:
      - eventId
      - name
      - venue
      - startsAt
      - status
      - ticketTypes
      - resourceVersion
      properties:
        eventId:
          type: string
        name:
          type: string
        venue:
          type: string
        startsAt:
          type: string
          format: date-time
          pattern: (?:Z|\+00:00)$
        saleStartsAt:
          type: string
          format: date-time
          pattern: (?:Z|\+00:00)$
        saleEndsAt:
          type: string
          format: date-time
          pattern: (?:Z|\+00:00)$
        status:
          enum:
          - DRAFT
          - ON_SALE
          - PAUSED
          - CANCELLED
          - ENDED
        ticketTypes:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              name:
                type: string
              price:
                $ref: '#/components/schemas/Money'
        resourceVersion:
          type: integer
          minimum: 1
    SaleEligibility:
      type: object
      additionalProperties: false
      required:
      - eventId
      - eligible
      - status
      properties:
        eventId:
          type: string
        eligible:
          type: boolean
        status:
          type: string
        reasonCode:
          type:
          - string
          - 'null'
        priceSnapshot:
          type: array
          items:
            type: object
    HealthStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - READY
          - NOT_READY
        service:
          type: string
        version:
          type: string
      example:
        status: READY
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: corr-1234567890abcdef
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: idem-booking-12345678
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated principal is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency, uniqueness or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Request violates validation or domain rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service or required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match does not match the current ETag.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Identity user JWT; verify signature, iss, aud, exp, sub, roles and tokenVersion.
    ServiceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service JWT; verify iss, sub, aud, iat, exp and jti and reject replay.
    WebhookHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 over X-Webhook-Timestamp + '.' + the exact request body; reject stale timestamps.
  headers:
    ETag:
      description: Strong resource-version validator used by If-Match.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
