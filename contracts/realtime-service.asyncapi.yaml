asyncapi: 3.0.0
info:
  title: Realtime Booking Status WebSocket API
  version: 1.0.0
  description: Best-effort booking status projection. The browser authenticates within five seconds using
    an ESB-issued signed, short-lived, single-use ticket in an authenticate frame; credentials in the
    URL are forbidden. REST remains authoritative.
  x-contract-status: canonical-v1
servers:
  local:
    host: localhost:8008
    pathname: /ws
    protocol: ws
    description: Local contract endpoint; deployment host is supplied by configuration.
channels:
  bookingStatus:
    address: /ws/bookings/{bookingId}
    servers:
    - $ref: '#/servers/local'
    parameters:
      bookingId:
        $ref: '#/components/parameters/bookingId'
    messages:
      clientMessage:
        $ref: '#/components/messages/ClientMessage'
      statusMessage:
        $ref: '#/components/messages/StatusMessage'
      controlMessage:
        $ref: '#/components/messages/ControlMessage'
    bindings:
      ws:
        method: GET
        headers:
          type: object
          properties:
            X-Correlation-ID:
              type: string
              maxLength: 128
            traceparent:
              type: string
              pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
        bindingVersion: 0.1.0
operations:
  receiveRealtimeClientMessage:
    action: receive
    channel:
      $ref: '#/channels/bookingStatus'
    messages:
    - $ref: '#/channels/bookingStatus/messages/clientMessage'
  sendRealtimeStatus:
    action: send
    channel:
      $ref: '#/channels/bookingStatus'
    messages:
    - $ref: '#/channels/bookingStatus/messages/statusMessage'
    - $ref: '#/channels/bookingStatus/messages/controlMessage'
components:
  parameters:
    bookingId:
      description: Booking authorized by the signed WebSocket ticket.
      location: $message.payload#/bookingId
  messages:
    ClientMessage:
      name: ClientMessage
      title: Client authentication and control frame
      contentType: application/json
      payload:
        $schema: https://json-schema.org/draft/2020-12/schema
        $id: urn:event-ticketing:realtime-client-message:v1
        title: RealtimeClientMessage
        description: Realtime client frames. authenticate with an ESB-issued signed one-time JWT/JWS ticket
          is mandatory before subscribe; long-lived access tokens and customerId are forbidden.
        x-contract-status: canonical-v1
        x-designed-baseline-version: 1.0.0
        oneOf:
        - type: object
          additionalProperties: false
          required:
          - type
          - ticket
          properties:
            type:
              const: authenticate
            ticket:
              type: string
              minLength: 16
              maxLength: 4096
              writeOnly: true
              description: Signed short-lived single-use JWT/JWS ticket; never log or place in a URL.
        - type: object
          additionalProperties: false
          required:
          - type
          - bookingId
          properties:
            type:
              const: subscribe
            bookingId:
              $ref: '#/$defs/bookingId'
            lastSequence:
              type: integer
              minimum: 0
        - type: object
          additionalProperties: false
          required:
          - type
          - bookingId
          properties:
            type:
              const: unsubscribe
            bookingId:
              $ref: '#/$defs/bookingId'
        - type: object
          additionalProperties: false
          required:
          - type
          - heartbeatId
          properties:
            type:
              const: heartbeat_ack
            heartbeatId:
              type: string
              minLength: 1
              maxLength: 64
        $defs:
          bookingId:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        examples:
        - type: authenticate
          ticket: example-not-a-real-ticket
        - type: subscribe
          bookingId: BKG-001
          lastSequence: 2
        - type: unsubscribe
          bookingId: BKG-001
        x-origin: official-design-v1
    StatusMessage:
      name: StatusMessage
      title: Booking status projection
      contentType: application/json
      correlationId:
        location: $message.payload#/correlationId
      payload:
        $schema: https://json-schema.org/draft/2020-12/schema
        $id: urn:event-ticketing:realtime-message:v1
        title: RealtimeMessage
        description: Best-effort non-authoritative booking status projection.
        x-contract-status: canonical-v1
        x-designed-baseline-version: 1.0.0
        type: object
        additionalProperties: false
        required:
        - messageId
        - bookingId
        - status
        - sequence
        - occurredAt
        - correlationId
        properties:
          messageId:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          bookingId:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          status:
            enum:
            - PENDING
            - SEAT_RESERVED
            - PAYMENT_PROCESSING
            - CONFIRMED
            - FAILED
            - CANCELLED
            - COMPENSATION_PENDING
          sequence:
            type: integer
            minimum: 1
          occurredAt:
            type: string
            format: date-time
            pattern: (?:Z|\+00:00)$
          correlationId:
            type: string
            minLength: 1
            maxLength: 128
          message:
            type: string
            maxLength: 300
        examples:
        - messageId: MSG-001
          bookingId: BKG-001
          status: PAYMENT_PROCESSING
          sequence: 3
          occurredAt: '2026-08-03T03:00:00Z'
          correlationId: corr-1234567890abcdef
          message: Payment result is being verified
        x-origin: phase5-machine-baseline
    ControlMessage:
      name: ControlMessage
      title: Server control frame
      contentType: application/json
      payload:
        $schema: https://json-schema.org/draft/2020-12/schema
        $id: urn:event-ticketing:realtime-server-control:v1
        title: RealtimeServerControlMessage
        description: Realtime authentication, reconnect, resync, heartbeat and lifecycle controls. Authentication
          failures never expose raw tickets or token details.
        x-contract-status: canonical-v1
        x-designed-baseline-version: 1.0.0
        oneOf:
        - type: object
          additionalProperties: false
          required:
          - type
          - bookingId
          - authenticatedAt
          properties:
            type:
              const: authenticated
            bookingId:
              $ref: '#/$defs/bookingId'
            authenticatedAt:
              type: string
              format: date-time
              pattern: (?:Z|\+00:00)$
        - type: object
          additionalProperties: false
          required:
          - type
          - code
          - retryable
          properties:
            type:
              const: authentication_failed
            code:
              type: string
              enum:
              - TICKET_EXPIRED
              - TICKET_REUSED
              - TICKET_INVALID
              - ACCESS_DENIED
            retryable:
              const: false
        - type: object
          additionalProperties: false
          required:
          - type
          - bookingId
          - authoritativeUrl
          - reason
          properties:
            type:
              const: resync_required
            bookingId:
              $ref: '#/$defs/bookingId'
            authoritativeUrl:
              type: string
              pattern: ^/api/bookings/[A-Za-z0-9._:-]+$
            reason:
              type: string
              enum:
              - reconnect
              - sequence_gap
              - history_unavailable
            lastObservedSequence:
              type:
              - integer
              - 'null'
              minimum: 0
        - type: object
          additionalProperties: false
          required:
          - type
          - heartbeatId
          - sentAt
          properties:
            type:
              const: heartbeat
            heartbeatId:
              type: string
              minLength: 1
              maxLength: 64
            sentAt:
              type: string
              format: date-time
              pattern: (?:Z|\+00:00)$
        - type: object
          additionalProperties: false
          required:
          - type
          - bookingId
          properties:
            type:
              const: connected
            bookingId:
              $ref: '#/$defs/bookingId'
        - type: object
          additionalProperties: false
          required:
          - type
          - retryable
          properties:
            type:
              const: shutdown
            retryable:
              const: true
        - type: object
          additionalProperties: false
          required:
          - type
          - code
          - message
          properties:
            type:
              const: protocol_error
            code:
              type: string
              pattern: ^[A-Z0-9_]{2,64}$
            message:
              type: string
              maxLength: 300
        $defs:
          bookingId:
            type: string
            pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
        examples:
        - type: authenticated
          bookingId: BKG-001
          authenticatedAt: '2026-08-03T03:00:05Z'
        - type: authentication_failed
          code: TICKET_EXPIRED
          retryable: false
        - type: authentication_failed
          code: TICKET_REUSED
          retryable: false
        - type: resync_required
          bookingId: BKG-001
          authoritativeUrl: /api/bookings/BKG-001
          reason: sequence_gap
          lastObservedSequence: 3
        x-origin: official-design-v1
x-close-codes:
- 1000
- 1001
- 1012
- 4400
- 4401
- 4403
- 4408
- 4410
- 4429
