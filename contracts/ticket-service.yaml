openapi: 3.1.0
info:
  title: Ticket Service API
  version: 1.0.0
  x-contract-status: canonical-v1
  x-designed-baseline-version: 1.0.0
  description: Baseline Giai đoạn 5 — hệ thống đặt vé sự kiện SOA/ESB.
servers:
- url: http://localhost:8006
  description: Local contract endpoint; deployment host is supplied by configuration.
security:
- ServiceJwt: []
paths:
  /tickets:issue:
    post:
      summary: Phát hành vé
      operationId: issueTickets
      responses:
        '201':
          description: Đã phát hành
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketIssue'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /tickets/{ticketId}:
    get:
      summary: Lấy vé
      operationId: getTicket
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /bookings/{bookingId}/tickets:
    get:
      summary: Liệt kê vé theo booking
      operationId: listBookingTickets
      responses:
        '200':
          description: Thành công
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /tickets/validate:
    post:
      summary: Xác thực QR
      operationId: validateTicket
      responses:
        '200':
          description: Kết quả
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketValidate'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      - $ref: '#/components/parameters/IdempotencyKey'
  /tickets/{ticketId}/check-in:
    post:
      summary: Check-in
      operationId: checkInTicket
      responses:
        '200':
          description: Đã check-in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /tickets/{ticketId}/cancel:
    post:
      summary: Hủy vé
      operationId: cancelTicket
      responses:
        '200':
          description: Đã hủy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /tickets/{ticketId}/reissue-qr:
    post:
      summary: Cấp lại QR
      operationId: reissueQr
      responses:
        '200':
          description: Đã cấp lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ticket'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: ticketId
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /health/live:
    get:
      operationId: ticketLiveness
      summary: Process liveness probe
      security: []
      responses:
        '200':
          description: Process is running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: UP
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
  /health/ready:
    get:
      operationId: ticketReadiness
      summary: Dependency readiness probe
      security: []
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
              example:
                status: READY
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
components:
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
      - correlationId
      - error
      properties:
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
        traceId:
          type: string
          pattern: ^[A-Fa-f0-9]{16,32}$
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - retryable
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]{1,63}$
            message:
              type: string
              minLength: 1
              maxLength: 500
            retryable:
              type: boolean
            details:
              type: object
              additionalProperties: true
      example:
        correlationId: corr-1234567890abcdef
        traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        error:
          code: RESOURCE_CONFLICT
          message: The resource changed; reload and retry.
          retryable: false
          details:
            currentVersion: 3
    Money:
      type: object
      additionalProperties: false
      required:
      - amountMinor
      - currency
      properties:
        amountMinor:
          type: integer
          minimum: 0
          format: int64
        currency:
          type: string
          pattern: ^[A-Z]{3}$
      example:
        amountMinor: 250000
        currency: VND
    TicketIssue:
      type: object
      additionalProperties: false
      required:
      - bookingId
      - eventId
      - customerId
      - items
      properties:
        bookingId:
          type: string
        eventId:
          type: string
        customerId:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - seatId
            properties:
              seatId:
                type: string
    Ticket:
      type: object
      additionalProperties: false
      required:
      - ticketId
      - bookingId
      - eventId
      - customerId
      - seatId
      - status
      - resourceVersion
      properties:
        ticketId:
          type: string
        bookingId:
          type: string
        eventId:
          type: string
        customerId:
          type: string
        seatId:
          type: string
        status:
          enum:
          - ISSUED
          - CHECKED_IN
          - CANCELLED
        qrToken:
          type:
          - string
          - 'null'
          description: Chỉ trả cho owner; không ghi log.
        resourceVersion:
          type: integer
          minimum: 1
    TicketValidate:
      type: object
      additionalProperties: false
      required:
      - qrToken
      properties:
        qrToken:
          type: string
          minLength: 16
    HealthStatus:
      type: object
      additionalProperties: false
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - READY
          - NOT_READY
        service:
          type: string
        version:
          type: string
      example:
        status: READY
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: corr-1234567890abcdef
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: idem-booking-12345678
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: The authenticated principal is not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency, uniqueness or state conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Request violates validation or domain rules.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Service or required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match does not match the current ETag.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected server failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Identity user JWT; verify signature, iss, aud, exp, sub, roles and tokenVersion.
    ServiceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived service JWT; verify iss, sub, aud, iat, exp and jti and reject replay.
    WebhookHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 over X-Webhook-Timestamp + '.' + the exact request body; reject stale timestamps.
  headers:
    ETag:
      description: Strong resource-version validator used by If-Match.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
