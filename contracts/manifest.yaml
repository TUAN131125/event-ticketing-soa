catalogVersion: 1.0.0
sourceOfTruth: contracts/
status: canonical-v1
managementFiles:
  - CONTRACT_STANDARD.md
  - CONTRACT_REVIEW.md
  - manifest.yaml
runtimeContracts:
  - id: esb-public-api
    owner: Booking Orchestrator / ESB
    port: 8000
    artifacts:
      - path: esb-public-api.yaml
        format: openapi-3.1
  - id: identity-service
    owner: Identity Service
    port: 8009
    artifacts:
      - path: identity-service.yaml
        format: openapi-3.1
  - id: customer-service
    owner: Customer Service
    port: 8001
    artifacts:
      - path: customer-service.yaml
        format: openapi-3.1
  - id: event-service
    owner: Event Service
    port: 8002
    artifacts:
      - path: event-service.yaml
        format: openapi-3.1
  - id: seat-inventory
    owner: Seat Inventory Service
    port: 8003
    artifacts:
      - path: seat-inventory.wsdl
        format: wsdl-1.1
      - path: seat-inventory.xsd
        format: xsd-1.0
  - id: booking-service
    owner: Booking Service
    port: 8004
    artifacts:
      - path: booking-service.yaml
        format: openapi-3.1
  - id: payment-service
    owner: Payment Service
    port: 8005
    artifacts:
      - path: payment-service.yaml
        format: openapi-3.1
  - id: ticket-service
    owner: Ticket Service
    port: 8006
    artifacts:
      - path: ticket-service.yaml
        format: openapi-3.1
  - id: notification-service
    owner: Notification Service
    port: 8007
    artifacts:
      - path: notification-service.yaml
        format: openapi-3.1
  - id: realtime-service
    owner: Realtime Status Service
    port: 8008
    artifacts:
      - path: realtime-service.openapi.yaml
        format: openapi-3.1
      - path: realtime-service.asyncapi.yaml
        format: asyncapi-3.0
  - id: event-messages
    owner: Domain event producers
    artifacts:
      - path: event-messages.schema.json
        format: json-schema-2020-12
