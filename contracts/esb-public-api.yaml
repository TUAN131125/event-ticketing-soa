  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Caller-supplied correlation id, echoed on the response. The gateway generates one when
        the header is absent.
      schema:
        type: string
        minLength: 1
        maxLength: 128
      example: corr-1234567890abcdef
    RequiredCorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      description: Correlation id that the caller must supply.
      schema:
        type: string
        minLength: 16
        maxLength: 64
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context. A new trace id is created when absent or malformed.
      schema:
        type: string
        pattern: ^[0-9a-f]{2}-[0-9a-f]{32}-[0-9a-f]{16}-[0-9a-f]{2}$
      example: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key that makes a retried command safe to replay.
      schema:
        type: string
        minLength: 8
        maxLength: 128
      example: idem-booking-12345678
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Resource version the command expects, taken from the last ETag.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
    OptionalIfMatch:
      name: If-Match
      in: header
      required: false
      description: Resource version the command expects. Optional because the operation also creates the
        resource when it does not exist yet; when omitted the gateway uses the version it just read.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PaymentDeclined:
      description: Payment was declined.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Not authorized.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: State, uniqueness or idempotency conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: If-Match does not match the resource version.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PayloadTooLarge:
      description: Request payload is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Validation or domain-rule rejection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccountLocked:
      description: Identity account is temporarily locked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Unexpected gateway failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: Provider returned an invalid response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Required dependency is unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    GatewayTimeout:
      description: Request deadline exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  securitySchemes:
    UserJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived Identity user JWT. The ESB verifies signature, issuer, audience, expiry,
        subject and roles.
    ServiceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Shared internal service JWT. Published so the catalogue vocabulary is identical across
        contracts; no public gateway operation accepts it — the ESB mints service JWTs for downstream
        calls instead of verifying them.
    WebhookHmac:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: HMAC-SHA256 over X-Webhook-Timestamp + '.' + the exact request body. Published for
        catalogue consistency; the gateway signs outbound notification webhooks with it and exposes no
        inbound webhook endpoint.
    RefreshCookie:
      type: apiKey
      in: cookie
      name: identity_refresh
      description: HttpOnly refresh-session cookie issued through the ESB auth façade.
    CsrfCookie:
      type: apiKey
      in: cookie
      name: identity_csrf
      description: Double-submit CSRF cookie issued by Identity through the ESB.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Must equal the identity_csrf cookie for refresh and logout.
  headers:
    ETag:
      description: Strong resource-version validator used by If-Match.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      example: '"3"'
