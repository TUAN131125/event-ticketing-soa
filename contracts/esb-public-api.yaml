      type: object
      required:
      - name
      - critical
      - status
      title: DependencyHealth
    ErrorResponse:
      properties:
        correlationId:
          type: string
          maxLength: 128
          minLength: 1
          title: Correlationid
        traceId:
          anyOf:
          - type: string
            pattern: ^[A-Fa-f0-9]{16,32}$
          - type: 'null'
          title: Traceid
        error:
          properties:
            code:
              type: string
              pattern: ^[A-Z][A-Z0-9_]{1,63}$
              title: Code
            message:
              type: string
              maxLength: 500
              minLength: 1
              title: Message
