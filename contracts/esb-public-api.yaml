          minItems: 1
          title: Seats
      additionalProperties: false
      type: object
      required:
      - inventoryVersion
      - seats
      title: ConfigureSeatInventoryRequest
    ConfigureSeatInventoryResult:
      properties:
        eventId:
          type: string
          title: Eventid
        inventoryVersion:
          type: integer
          minimum: 1.0
          title: Inventoryversion
        configuredSeatCount:
          type: integer
          minimum: 0.0
          title: Configuredseatcount
        status:
          type: string
          enum:
