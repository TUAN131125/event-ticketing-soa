          - type: 'null'
          title: Phone
      additionalProperties: false
      type: object
      required:
      - fullName
      - email
      title: CustomerProfileInput
    CustomerProfileProjection:
      properties:
        customerId:
          type: string
          title: Customerid
        fullName:
          type: string
          title: Fullname
        email:
          type: string
          format: email
          title: Email
        phone:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - ANONYMIZED
          title: Status
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
        createdAt:
          type: string
          format: date-time
          title: Createdat
          pattern: (?:Z|\+00:00)$
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
          pattern: (?:Z|\+00:00)$
      additionalProperties: false
      type: object
      required:
      - customerId
      - fullName
      - email
      - status
      - resourceVersion
      - createdAt
      - updatedAt
      title: CustomerProfileProjection
    DependencyHealth:
      properties:
        name:
          type: string
          title: Name
        critical:
          type: boolean
          title: Critical
        status:
          type: string
          enum:
          - UP
          - DOWN
          title: Status
        latencyMs:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: Latencyms
        errorCode:
          anyOf:
