components:
  schemas:
    AdminSeatDefinition:
      properties:
        seatId:
          type: string
          maxLength: 128
          minLength: 1
          title: Seatid
        section:
          type: string
          maxLength: 100
          minLength: 1
          title: Section
        rowLabel:
          type: string
          maxLength: 100
          minLength: 1
          title: Rowlabel
        seatNumber:
          type: string
          maxLength: 100
          minLength: 1
          title: Seatnumber
        ticketTypeId:
          type: string
          maxLength: 64
          minLength: 1
          title: Tickettypeid
        status:
          type: string
          enum:
          - AVAILABLE
          - BLOCKED
          title: Status
          default: AVAILABLE
      additionalProperties: false
      type: object
      required:
      - seatId
      - section
      - rowLabel
      - seatNumber
      - ticketTypeId
      title: AdminSeatDefinition
    AdminSeatInventoryProjection:
      properties:
        eventId:
          type: string
          title: Eventid
        generatedAt:
          type: string
          format: date-time
          title: Generatedat
          pattern: (?:Z|\+00:00)$
        seats:
          items:
            $ref: '#/components/schemas/SeatProjection'
          type: array
          title: Seats
      additionalProperties: false
      type: object
      required:
      - eventId
      - generatedAt
      - seats
      title: AdminSeatInventoryProjection
    AdminTicketTypeInput:
      properties:
        ticketTypeId:
          type: string
          maxLength: 64
          minLength: 1
          title: Tickettypeid
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        price:
          $ref: '#/components/schemas/MoneyRequest'
      additionalProperties: false
      type: object
      required:
      - ticketTypeId
      - name
      - price
      title: AdminTicketTypeInput
    AggregateHealth:
      properties:
        status:
          type: string
          enum:
          - UP
          - DEGRADED
          - DOWN
          title: Status
        checkedAt:
          type: string
          format: date-time
          title: Checkedat
          pattern: (?:Z|\+00:00)$
        dependencies:
          items:
            $ref: '#/components/schemas/DependencyHealth'
          type: array
          title: Dependencies
      additionalProperties: false
      type: object
      required:
      - status
      - checkedAt
      - dependencies
      title: AggregateHealth
    AuthRole:
      type: string
      enum:
      - CUSTOMER
      - ADMIN
      - CHECKIN_STAFF
      - SERVICE
      title: AuthRole
    BookingListProjection:
      properties:
        items:
          items:
            $ref: '#/components/schemas/BookingResult'
          type: array
          title: Items
        page:
          type: integer
          minimum: 1.0
          title: Page
        pageSize:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Pagesize
        totalItems:
          type: integer
          minimum: 0.0
          title: Totalitems
      additionalProperties: false
      type: object
      required:
      - items
      - page
      - pageSize
      - totalItems
      title: BookingListProjection
    BookingPaymentStatus:
      type: string
      enum:
      - PENDING
      - PROCESSING
      - SUCCEEDED
      - FAILED
      - UNKNOWN
      - REFUND_PENDING
      - REFUNDED
      title: BookingPaymentStatus
    BookingResult:
      properties:
        bookingId:
          type: string
          title: Bookingid
        eventId:
          type: string
          title: Eventid
        seatIds:
          items:
            type: string
          type: array
          title: Seatids
        status:
          $ref: '#/components/schemas/BookingStatus'
        total:
          $ref: '#/components/schemas/Money'
        reservationId:
          anyOf:
          - type: string
          - type: 'null'
          title: Reservationid
        paymentId:
          anyOf:
          - type: string
          - type: 'null'
          title: Paymentid
        ticketIds:
          items:
            type: string
          type: array
          title: Ticketids
        correlationId:
          type: string
          title: Correlationid
        paymentStatus:
          anyOf:
          - $ref: '#/components/schemas/BookingPaymentStatus'
          - type: 'null'
        workflowId:
          anyOf:
          - type: string
          - type: 'null'
          title: Workflowid
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
        createdAt:
          anyOf:
          - type: string
            format: date-time
            pattern: (?:Z|\+00:00)$
          - type: 'null'
          title: Createdat
        updatedAt:
          anyOf:
          - type: string
            format: date-time
            pattern: (?:Z|\+00:00)$
          - type: 'null'
          title: Updatedat
      additionalProperties: false
      type: object
      required:
      - bookingId
      - eventId
      - seatIds
      - status
      - total
      - ticketIds
      - correlationId
      - resourceVersion
      title: BookingResult
    BookingStatus:
      type: string
      enum:
      - PENDING
      - SEAT_RESERVED
      - PAYMENT_PROCESSING
      - CONFIRMED
      - FAILED
      - CANCELLED
      - COMPENSATION_PENDING
      title: BookingStatus
    CancelBookingRequest:
      properties:
        reason:
          type: string
          maxLength: 2000
          minLength: 1
          title: Reason
          default: USER_REQUEST
      additionalProperties: false
      type: object
      title: CancelBookingRequest
    CheckInRequest:
      properties:
        qrToken:
          type: string
          maxLength: 4096
          minLength: 16
          title: Qrtoken
      additionalProperties: false
      type: object
      required:
