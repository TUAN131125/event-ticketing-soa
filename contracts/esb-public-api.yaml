openapi: 3.1.0
info:
  title: ESB / Booking Orchestrator
  version: 2.2.0
  description: Canonical public contract for the ESB / Booking Orchestrator. This is the only HTTP surface
    browsers may call; Identity, Booking, Payment, Ticket, Customer, Event, Seat Inventory and Realtime
    are reached through it.
servers:
- url: http://localhost:8000
  description: Local contract endpoint; deployment host is supplied by configuration.
security:
- UserJwt: []
paths:
  /api/auth/register:
    post:
      summary: Auth Register
      operationId: registerIdentityAccountViaEsb
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security: []
  /api/auth/login:
    post:
      summary: Auth Login
      operationId: loginIdentityAccountViaEsb
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          headers:
            Set-Cookie:
              description: Identity refresh and CSRF cookies. Multiple Set-Cookie header fields may be
                returned; the ESB preserves HttpOnly, Secure and SameSite attributes and rewrites Path
                to /api/auth.
              schema:
                type: string
            Cache-Control:
              description: Authentication responses are not cacheable.
              schema:
                type: string
                example: no-store
            Pragma:
              description: Legacy no-cache directive preserved from Identity.
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/AccountLocked'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security: []
  /api/auth/refresh:
    post:
      summary: Auth Refresh
      operationId: refreshIdentitySessionViaEsb
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Successful Response
          headers:
            Set-Cookie:
              description: Identity refresh and CSRF cookies. Multiple Set-Cookie header fields may be
                returned; the ESB preserves HttpOnly, Secure and SameSite attributes and rewrites Path
                to /api/auth.
              schema:
                type: string
            Cache-Control:
              description: Authentication responses are not cacheable.
              schema:
                type: string
                example: no-store
            Pragma:
              description: Legacy no-cache directive preserved from Identity.
              schema:
                type: string
                example: no-cache
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - RefreshCookie: []
        CsrfCookie: []
        CsrfHeader: []
  /api/auth/logout:
    post:
      summary: Auth Logout
      operationId: logoutIdentitySessionViaEsb
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '204':
          description: Successful Response
          headers:
            Set-Cookie:
              description: Identity refresh and CSRF cookies. Multiple Set-Cookie header fields may be
                returned; the ESB preserves HttpOnly, Secure and SameSite attributes and rewrites Path
                to /api/auth.
              schema:
                type: string
            Cache-Control:
              description: Authentication responses are not cacheable.
              schema:
                type: string
                example: no-store
            Pragma:
              description: Legacy no-cache directive preserved from Identity.
              schema:
                type: string
                example: no-cache
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - RefreshCookie: []
        CsrfCookie: []
        CsrfHeader: []
  /api/auth/me:
    get:
      summary: Auth Me
      operationId: getCurrentIdentityPrincipalViaEsb
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - UserJwt: []
  /api/events:
    get:
      summary: List Events
      operationId: publicListEvents
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/PublicEvent'
                type: array
                title: Response Publiclistevents
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security: []
  /api/events/{eventId}:
    get:
      summary: Get Event
      operationId: publicGetEvent
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          title: Eventid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security: []
  /api/events/{eventId}/seat-map:
    get:
      summary: Seat Map
      operationId: publicGetEventSeatMap
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          title: Eventid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatMapProjection'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security: []
  /api/bookings:
    post:
      summary: Place Booking
      operationId: placeBooking
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceBookingRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '202':
          description: Booking is reconciling.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Location:
              schema:
                type: string
            Retry-After:
              schema:
                type: string
                pattern: ^[1-9][0-9]*$
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentDeclined'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - UserJwt: []
    get:
      summary: List Bookings
      operationId: publicListBookings
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Traceparent'
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/BookingStatus'
          - type: 'null'
          title: Status
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Pagesize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingListProjection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      security:
      - UserJwt: []
  /api/bookings/{bookingId}:
    get:
      summary: Get Booking
      operationId: publicGetBooking
