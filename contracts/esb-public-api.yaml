      required:
      - channel
      - granted
      title: ConsentUpdateRequest
    ConsentUpdateResult:
      properties:
        customerId:
          type: string
          title: Customerid
        channel:
          type: string
          enum:
          - EMAIL
          - SMS
          title: Channel
        granted:
          type: boolean
          title: Granted
        resourceVersion:
          type: integer
          minimum: 1.0
          title: Resourceversion
      additionalProperties: false
      type: object
      required:
      - customerId
      - channel
      - granted
      - resourceVersion
      title: ConsentUpdateResult
    CustomerProfileInput:
      properties:
        fullName:
          type: string
          maxLength: 150
          minLength: 2
          title: Fullname
        email:
          type: string
          format: email
          title: Email
        phone:
          anyOf:
          - type: string
