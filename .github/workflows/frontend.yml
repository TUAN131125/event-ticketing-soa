name: Frontend

on:
  pull_request:
    paths: ['frontend/**', 'contracts/esb-public-api.yaml', '.github/workflows/frontend.yml']
  push:
    branches: [main]
    paths: ['frontend/**', 'contracts/esb-public-api.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
