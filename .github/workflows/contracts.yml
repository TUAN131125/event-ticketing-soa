name: Contracts

on:
  pull_request:
    paths:
      - 'contracts/**'
      - 'services/**'
      - 'gateway/booking-orchestrator/**'
      - 'frontend/**'
      - '.github/workflows/contracts.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'services/**'
      - 'gateway/booking-orchestrator/**'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install pyyaml==6.0.3 jsonschema==4.23.0 lxml==6.1.0
      - name: Validate canonical contracts
        run: python contracts/scripts/validate_contracts.py
      - name: Build runtime artifacts
        run: python contracts/scripts/build_contracts.py
      - uses: actions/upload-artifact@v4
        with:
          name: event-ticketing-contracts
          path: dist/contracts/
          if-no-files-found: error
