name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install bandit==1.8.6 pip-audit==2.9.0
      - run: bandit -q -r gateway services libs -x '*/tests/*,*/migrations/*'
      - name: Audit Python lock inputs
        shell: bash
        run: |
          set -eu
          find gateway services -name requirements.txt -print0 | while IFS= read -r -d '' file; do
            python -m pip_audit -r "$file"
          done
      - working-directory: frontend
        run: npm ci && npm audit --audit-level=hight
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python,javascript-typescript
      - uses: github/codeql-action/analyze@v3
