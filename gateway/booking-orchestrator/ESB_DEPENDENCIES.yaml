version: 1.0.0
documentClass: derived-orchestration-design
canonicalContract: false
canonicalAuthority: contracts/**
description: >-
  Machine-readable ESB orchestration design derived from the frozen canonical
  contracts. This file plans call ordering, failure handling and resilience;
  it is not a canonical contract and must never override contracts/**.
contractCatalog: contracts/manifest.yaml
contractCatalogVersion: 1.0.0
orchestrator: booking-orchestrator
crossServiceDatabaseAccess: forbidden
criticalWorkflowTransports: [REST, SOAP, INTERNAL_REST]

globalInvariants:
  authoritativeCustomer: Customer mapping resolved from verified JWT sub; browser customerId is never ownership proof.
  authoritativePrice: Event Service sale eligibility and ticket type price.
  authoritativeBookingState: Booking Service; ESB memory is never the booking state store.
  correlation: X-Correlation-ID is required or generated once and propagated to every provider call and compensation.
  deadline: Retries are allowed only while the remaining request budget permits.
  distributedTransaction: forbidden
  providerDatabaseRead: forbidden
  getReservationPrecondition: GetReservation is allowed only when reservationId is known from a ReserveSeats response or persisted reservation evidence.

timeoutClasses:
  read: {budget: SHORT, boundedBy: REMAINING_REQUEST_BUDGET}
  internalDecision: {budget: SHORT, boundedBy: REMAINING_REQUEST_BUDGET}
  seatCommand: {budget: MEDIUM, boundedBy: REMAINING_REQUEST_BUDGET}
  paymentCommand: {budget: LONG, boundedBy: REMAINING_REQUEST_BUDGET}
  bookingCommand: {budget: MEDIUM, boundedBy: REMAINING_REQUEST_BUDGET}
  ticketCommand: {budget: MEDIUM, boundedBy: REMAINING_REQUEST_BUDGET}
  sideEffect: {budget: SHORT, boundedBy: REMAINING_REQUEST_BUDGET}

retryClasses:
  none:
    attempts: one
    conditions: [validation_error, authentication_error, authorization_error, business_fault, non_idempotent_command]
  safeRead:
    attempts: bounded
    conditions: [transient_connection_failure, timeout, remaining_deadline]
  idempotentCommand:
    attempts: bounded
    conditions: [same_idempotency_key, same_payload, transient_failure, remaining_deadline]
  reconciliationOnly:
    attempts: none_in_request
    conditions: [payment_command_outcome_unknown]
    nextPath: reconcilePayment
  sideEffectAtLeastOnce:
    attempts: bounded_async_or_post_commit
    conditions: [idempotency_or_dedup_identity, booking_result_already_committed]
    bookingRollbackOnFailure: false

idempotencyPolicy:
  publicCommands: Preserve the public Idempotency-Key for the workflow identity.
  providerCommands: Derive stable step keys from workflow ID and step; retries reuse the same key and payload.
  replay: Return the recorded workflow result without starting another provider sequence.
  paymentCapture: Never blind retry after timeout; record UNKNOWN and use reconciliationOnly.
  compensations: Every compensation reuses a stable compensation key and propagates correlation ID.

errorMappingPolicy:
  targetSchema: contracts/esb-public-api.yaml#/components/schemas/ErrorResponse
  preserve: [correlationId, traceId_when_available, stable_error_code, retryable, safe_details]
  redact: [traceback, internal_provider_url, token, raw_soap_xml, secret, unnecessary_pii]
  mappings:
    REST_PROVIDER_ERROR:
      codeSource: provider ErrorResponse code
      retryableSource: provider retryable plus retry class
      safeDetails: [providerService, providerCode]
    SOAP_FAULT:
      code: SEAT_SERVICE_FAULT
      retryable: false_for_business_fault
      safeDetails: [soapFaultCode, operation]
      preserveOriginalFaultCode: true
    TIMEOUT:
      code: DEPENDENCY_TIMEOUT
      retryable: depends_on_retry_class_and_deadline
    CONNECTION_FAILURE:
      code: DEPENDENCY_UNAVAILABLE
      retryable: true_for_safe_read_or_idempotent_command
    CIRCUIT_OPEN:
      code: DEPENDENCY_UNAVAILABLE
      retryable: true
      safeDetails: [providerService]
    INVALID_PROVIDER_RESPONSE:
      code: INVALID_DEPENDENCY_RESPONSE
      retryable: false
      safeDetails: [providerService, violatedContract]

providerOperations:
  customerResolve: &customerResolve {contractId: customer-service, canonicalPath: customer-service.yaml, operationId: resolveCustomerIdentityMapping, method: GET, path: '/internal/identity-mappings/{identitySubject}'}
  customerGet: &customerGet {contractId: customer-service, canonicalPath: customer-service.yaml, operationId: getCustomer, method: GET, path: '/customers/{customerId}'}
  eventList: &eventList {contractId: event-service, canonicalPath: event-service.yaml, operationId: listEvents, method: GET, path: /events}
  eventGet: &eventGet {contractId: event-service, canonicalPath: event-service.yaml, operationId: getEvent, method: GET, path: '/events/{eventId}'}
  eventEligibility: &eventEligibility {contractId: event-service, canonicalPath: event-service.yaml, operationId: getSaleEligibility, method: GET, path: '/events/{eventId}/sale-eligibility'}
  seatCheck: &seatCheck {contractId: seat-inventory, canonicalPath: seat-inventory.wsdl, operationId: CheckAvailability, method: SOAP, path: 'urn:event-ticketing:seat:v1/CheckAvailability'}
  seatReserve: &seatReserve {contractId: seat-inventory, canonicalPath: seat-inventory.wsdl, operationId: ReserveSeats, method: SOAP, path: 'urn:event-ticketing:seat:v1/ReserveSeats'}
  seatGetReservation: &seatGetReservation {contractId: seat-inventory, canonicalPath: seat-inventory.wsdl, operationId: GetReservation, method: SOAP, path: 'urn:event-ticketing:seat:v1/GetReservation'}
  seatConfirm: &seatConfirm {contractId: seat-inventory, canonicalPath: seat-inventory.wsdl, operationId: ConfirmSeats, method: SOAP, path: 'urn:event-ticketing:seat:v1/ConfirmSeats'}
  seatRelease: &seatRelease {contractId: seat-inventory, canonicalPath: seat-inventory.wsdl, operationId: ReleaseSeats, method: SOAP, path: 'urn:event-ticketing:seat:v1/ReleaseSeats'}
  bookingCreate: &bookingCreate {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: createBooking, method: POST, path: /bookings}
  bookingGet: &bookingGet {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: getBooking, method: GET, path: '/bookings/{bookingId}'}
  bookingReservation: &bookingReservation {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingReservation, method: POST, path: '/bookings/{bookingId}/reservation'}
  bookingPaymentStarted: &bookingPaymentStarted {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingPaymentStarted, method: POST, path: '/bookings/{bookingId}/payment-started'}
  bookingPaymentResult: &bookingPaymentResult {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingPaymentResult, method: POST, path: '/bookings/{bookingId}/payment-result'}
  bookingTickets: &bookingTickets {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingTickets, method: POST, path: '/bookings/{bookingId}/tickets'}
  bookingConfirm: &bookingConfirm {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingConfirm, method: POST, path: '/bookings/{bookingId}/confirm'}
  bookingFail: &bookingFail {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingFail, method: POST, path: '/bookings/{bookingId}/fail'}
  bookingCancel: &bookingCancel {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: bookingCancel, method: POST, path: '/bookings/{bookingId}/cancel'}
  bookingAccess: &bookingAccess {contractId: booking-service, canonicalPath: booking-service.yaml, operationId: decideBookingResourceAccess, method: POST, path: '/internal/bookings/{bookingId}/access-decisions'}
  paymentCreate: &paymentCreate {contractId: payment-service, canonicalPath: payment-service.yaml, operationId: createPayment, method: POST, path: /payments}
  paymentGet: &paymentGet {contractId: payment-service, canonicalPath: payment-service.yaml, operationId: getPayment, method: GET, path: '/payments/{paymentId}'}
  paymentAuthorize: &paymentAuthorize {contractId: payment-service, canonicalPath: payment-service.yaml, operationId: authorizePayment, method: POST, path: '/payments/{paymentId}/authorize'}
  paymentCapture: &paymentCapture {contractId: payment-service, canonicalPath: payment-service.yaml, operationId: capturePayment, method: POST, path: '/payments/{paymentId}/capture'}
  paymentRefund: &paymentRefund {contractId: payment-service, canonicalPath: payment-service.yaml, operationId: createRefund, method: POST, path: '/payments/{paymentId}/refunds'}
  paymentReconcile: &paymentReconcile {contractId: payment-service, canonicalPath: payment-service.yaml, operationId: reconcilePayment, method: POST, path: '/payments/{paymentId}/reconcile'}
  ticketIssue: &ticketIssue {contractId: ticket-service, canonicalPath: ticket-service.yaml, operationId: issueTickets, method: POST, path: '/tickets:issue'}
  ticketListBooking: &ticketListBooking {contractId: ticket-service, canonicalPath: ticket-service.yaml, operationId: listBookingTickets, method: GET, path: '/bookings/{bookingId}/tickets'}
  ticketCancel: &ticketCancel {contractId: ticket-service, canonicalPath: ticket-service.yaml, operationId: cancelTicket, method: POST, path: '/tickets/{ticketId}/cancel'}
  notificationIngress: &notificationIngress {contractId: notification-service, canonicalPath: notification-service.yaml, operationId: receiveEventWebhook, method: POST, path: /webhooks/events}
  realtimeIngress: &realtimeIngress {contractId: realtime-service, canonicalPath: realtime-service.openapi.yaml, operationId: ingestRealtimeStatusEvent, method: POST, path: /internal/status-events}
  identityJwks: &identityJwks {contractId: identity-service, canonicalPath: identity-service.yaml, operationId: getIdentityJwks, method: GET, path: /.well-known/jwks.json}

publicOperations:
  - publicOperationId: publicListEvents
    method: GET
    path: /api/events
    authentication: none
    authorization: public event read
    requiredHeaders: []
    acceptedHeaders: []
    generatedHeaders: [X-Correlation-ID]
    security: []
    requestSchema: null
    responseSchemas:
      '200': '#/paths/~1api~1events/get/responses/200/content/application~1json/schema'
    providerCalls:
      - {<<: *eventList, step: 1, service: event-service, protocol: REST, criticality: critical, inputFrom: public query, outputTo: public event projection, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: return transformed list, onFailure: normalized ErrorResponse, compensation: none}
    timeoutPolicy: read
    retryPolicy: safeRead
    idempotencyPolicy: naturally-idempotent
    errorMappings: [REST_PROVIDER_ERROR, TIMEOUT, CONNECTION_FAILURE, CIRCUIT_OPEN, INVALID_PROVIDER_RESPONSE]
    workflowResult: Canonical PublicEvent array only; no Booking, Payment or Seat call.

  - publicOperationId: publicGetEvent
    method: GET
    path: /api/events/{eventId}
    authentication: none
    authorization: public event read
    requiredHeaders: []
    acceptedHeaders: []
    generatedHeaders: [X-Correlation-ID]
    security: []
    requestSchema: path.eventId
    responseSchemas:
      '200': '#/components/schemas/PublicEvent'
      '404': '#/components/schemas/ErrorResponse'
      '503': '#/components/schemas/ErrorResponse'
    providerCalls:
      - {<<: *eventGet, step: 1, service: event-service, protocol: REST, criticality: critical, inputFrom: path.eventId, outputTo: public event projection, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: return transformed detail, onFailure: normalized ErrorResponse, compensation: none}
    timeoutPolicy: read
    retryPolicy: safeRead
    idempotencyPolicy: naturally-idempotent
    errorMappings: [REST_PROVIDER_ERROR, TIMEOUT, CONNECTION_FAILURE, CIRCUIT_OPEN, INVALID_PROVIDER_RESPONSE]
    workflowResult: Canonical PublicEvent only; seat availability is not added.

  - publicOperationId: placeBooking
    method: POST
    path: /api/bookings
    authentication: UserJwt required; verify signature/issuer/audience/expiry and read sub plus roles
    authorization: Customer derived through Customer mapping; browser customerId is ignored as ownership proof
    requiredHeaders: [Idempotency-Key]
    acceptedHeaders: [X-Correlation-ID, traceparent]
    generatedHeaders: [X-Correlation-ID]
    security: [UserJwt]
    requestSchema: '#/components/schemas/PlaceBookingRequest'
    responseSchemas:
      '201': '#/components/schemas/BookingResult'
      '202': '#/components/schemas/BookingResult'
      '402': '#/components/schemas/ErrorResponse'
      '409': '#/components/schemas/ErrorResponse'
      '422': '#/components/schemas/ErrorResponse'
      '503': '#/components/schemas/ErrorResponse'
    providerCalls:
      - {<<: *customerResolve, step: 1, service: customer-service, protocol: INTERNAL_REST, criticality: critical, inputFrom: verifiedJwt.sub, outputTo: workflow.customerId, timeoutClass: internalDecision, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: require ACTIVE mapping, onFailure: fail-closed before seat/payment, compensation: none}
      - {<<: *customerGet, step: 2, service: customer-service, protocol: REST, criticality: critical, inputFrom: workflow.customerId, outputTo: workflow.customer, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: require ACTIVE customer, onFailure: fail-closed before seat/payment, compensation: none}
      - {<<: *eventGet, step: 3, service: event-service, protocol: REST, criticality: critical, inputFrom: request.eventId, outputTo: workflow.event, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: validate event and ticket type, onFailure: stop, compensation: none}
      - {<<: *eventEligibility, step: 4, service: event-service, protocol: REST, criticality: critical, inputFrom: request selection plus workflow.event, outputTo: authoritative price and eligibility, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: ignore browser price and continue, onFailure: stop, compensation: none}
      - {<<: *seatCheck, step: 5, service: seat-inventory-service, protocol: SOAP, criticality: critical, inputFrom: selection plus correlation/caller/schemaVersion, outputTo: availability evidence, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: continue, onFailure: normalize SOAP Fault and stop, compensation: none}
      - {<<: *bookingCreate, step: 6, service: booking-service, protocol: REST, criticality: critical, inputFrom: authoritative customer/event/items/price, outputTo: createBooking.output including Booking PENDING evidence and bookingId, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: public-workflow-key, onSuccess: persist workflow bookingId, onFailure: stop before reservation; no compensation, compensation: none}
      - {<<: *seatReserve, step: 7, service: seat-inventory-service, protocol: SOAP, criticality: critical, inputFrom: createBooking.output.bookingId plus eventId/seatIds/ttlSeconds/requestContext and stable step idempotency key; every replay uses the identical values, outputTo: reservation evidence, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: determined failure records bookingFail; timeout or unknown performs bounded same-key same-payload ReserveSeats replay while deadline remains, compensation: none}
      - {<<: *bookingReservation, step: 8, service: booking-service, protocol: REST, criticality: critical, inputFrom: reservation evidence, outputTo: Booking SEAT_RESERVED evidence, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: release reservation and record compensation, compensation: ReleaseSeats}
      - {<<: *paymentCreate, step: 9, service: payment-service, protocol: REST, criticality: critical, inputFrom: bookingId plus authoritative price, outputTo: paymentId, timeoutClass: paymentCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: release reservation and fail booking, compensation: ReleaseSeats}
      - {<<: *bookingPaymentStarted, step: 10, service: booking-service, protocol: REST, criticality: critical, inputFrom: paymentId and reservation evidence, outputTo: Booking PAYMENT_PROCESSING evidence, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: stop and reconcile workflow evidence, compensation: ReleaseSeats-if-no-charge}
      - {<<: *paymentAuthorize, step: 11, service: payment-service, protocol: REST, criticality: critical, inputFrom: paymentId, outputTo: authorization result, timeoutClass: paymentCommand, retryClass: reconciliationOnly, idempotency: provider-command-key, onSuccess: continue by result, onFailure: UNKNOWN on ambiguous timeout, compensation: reconciliation}
      - {<<: *paymentCapture, step: 12, service: payment-service, protocol: REST, criticality: critical, inputFrom: authorized paymentId, outputTo: CAPTURED/FAILED/UNKNOWN, timeoutClass: paymentCommand, retryClass: reconciliationOnly, idempotency: provider-command-key, onSuccess: branch by verified result, onFailure: record UNKNOWN; never blind retry, compensation: reconciliation}
      - {<<: *bookingPaymentResult, step: 13, service: booking-service, protocol: REST, criticality: critical, inputFrom: verified payment result/evidence, outputTo: persisted payment evidence, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: branch, onFailure: COMPENSATION_PENDING when captured, compensation: reconciliation}
      - {<<: *ticketIssue, step: 14, service: ticket-service, protocol: REST, criticality: critical_after_capture, inputFrom: verified CAPTURED evidence plus booking items, outputTo: ticketIds, timeoutClass: ticketCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: Booking COMPENSATION_PENDING and refund/release plan, compensation: RefundPayment+ReleaseSeats}
      - {<<: *bookingTickets, step: 15, service: booking-service, protocol: REST, criticality: critical_after_capture, inputFrom: issued ticket evidence, outputTo: persisted ticket evidence, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: COMPENSATION_PENDING, compensation: CancelTickets+RefundPayment+ReleaseSeats}
      - {<<: *seatConfirm, step: 16, service: seat-inventory-service, protocol: SOAP, criticality: critical_after_capture, inputFrom: reservationId plus correlation/caller/schemaVersion/idempotency, outputTo: seat confirmation evidence, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: continue, onFailure: COMPENSATION_PENDING, compensation: CancelTickets+RefundPayment+ReleaseSeats}
      - {<<: *bookingConfirm, step: 17, service: booking-service, protocol: REST, criticality: critical, inputFrom: payment captured plus seat confirmed plus ticket issued evidence, outputTo: Booking CONFIRMED, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: commit public 201 result, onFailure: retain evidence and reconcile; never synthesize confirmation, compensation: COMPENSATION_PENDING_if_required}
      - {<<: *notificationIngress, step: 18, service: notification-service, protocol: REST, criticality: non-critical, criticalPath: false, bookingRollbackOnFailure: false, inputFrom: confirmed booking event envelope, outputTo: delivery acknowledgement, timeoutClass: sideEffect, retryClass: sideEffectAtLeastOnce, idempotency: eventId, onSuccess: observe only, onFailure: record side-effect failure, compensation: none}
      - {<<: *realtimeIngress, step: 19, service: realtime-status-service, protocol: INTERNAL_REST, criticality: non-critical, criticalPath: false, bookingRollbackOnFailure: false, inputFrom: non-authoritative confirmed projection, outputTo: ingest acknowledgement, timeoutClass: sideEffect, retryClass: sideEffectAtLeastOnce, idempotency: messageId, onSuccess: observe only, onFailure: REST fallback remains authoritative, compensation: none}
    timeoutPolicy: remaining request budget with class-specific symbolic budgets
    retryPolicy: safe reads and idempotent commands only; payment ambiguity uses reconciliationOnly
    idempotencyPolicy: one workflow per Idempotency-Key and request hash
    errorMappings: [REST_PROVIDER_ERROR, SOAP_FAULT, TIMEOUT, CONNECTION_FAILURE, CIRCUIT_OPEN, INVALID_PROVIDER_RESPONSE]
    workflowResult: 201 only after Booking CONFIRMED evidence; 202 for payment UNKNOWN/reconciliation; normalized failure otherwise.

  - publicOperationId: publicGetBooking
    method: GET
    path: /api/bookings/{bookingId}
    authentication: UserJwt required
    authorization: Booking access decision from verified JWT sub and roles; deny before disclosure
    requiredHeaders: []
    acceptedHeaders: []
    generatedHeaders: [X-Correlation-ID]
    security: [UserJwt]
    requestSchema: path.bookingId
    responseSchemas:
      '200': '#/components/schemas/BookingResult'
      '403': '#/components/schemas/ErrorResponse'
      '404': '#/components/schemas/ErrorResponse'
    providerCalls:
      - {<<: *bookingAccess, step: 1, service: booking-service, protocol: INTERNAL_REST, criticality: critical, inputFrom: path.bookingId plus verifiedJwt.sub/roles, outputTo: allowed decision, timeoutClass: internalDecision, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: continue only when allowed, onFailure: deny before resource disclosure, compensation: none}
      - {<<: *bookingGet, step: 2, service: booking-service, protocol: REST, criticality: critical, inputFrom: path.bookingId, outputTo: public BookingResult, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: return projection, onFailure: normalized ErrorResponse, compensation: none}
    timeoutPolicy: internalDecision then read
    retryPolicy: safeRead
    idempotencyPolicy: naturally-idempotent
    errorMappings: [REST_PROVIDER_ERROR, TIMEOUT, CONNECTION_FAILURE, CIRCUIT_OPEN, INVALID_PROVIDER_RESPONSE]
    workflowResult: Return authoritative Booking projection only after allowed decision.

  - publicOperationId: publicCancelBooking
    method: POST
    path: /api/bookings/{bookingId}/cancel
    authentication: UserJwt required
    authorization: Booking access decision before reading or mutating booking
    requiredHeaders: [Idempotency-Key]
    acceptedHeaders: []
    generatedHeaders: [X-Correlation-ID]
    security: [UserJwt]
    requestSchema: path.bookingId
    responseSchemas:
      '200': '#/components/schemas/BookingResult'
      '403': '#/components/schemas/ErrorResponse'
      '404': '#/components/schemas/ErrorResponse'
      '409': '#/components/schemas/ErrorResponse'
      '503': '#/components/schemas/ErrorResponse'
    providerCalls:
      - {<<: *bookingAccess, step: 1, service: booking-service, protocol: INTERNAL_REST, criticality: critical, inputFrom: path.bookingId plus verifiedJwt.sub/roles, outputTo: allowed decision, timeoutClass: internalDecision, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: continue only when allowed, onFailure: deny before disclosure, compensation: none}
      - {<<: *bookingGet, step: 2, service: booking-service, protocol: REST, criticality: critical, inputFrom: path.bookingId, outputTo: authoritative state/evidence, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: choose evidence-driven compensations, onFailure: stop, compensation: none}
      - {<<: *ticketListBooking, step: 3, service: ticket-service, protocol: REST, criticality: conditional, inputFrom: booking evidence, outputTo: issued ticket evidence, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: cancel issued cancellable tickets, onFailure: COMPENSATION_PENDING when ticket evidence is required, compensation: none}
      - {<<: *ticketCancel, step: 4, service: ticket-service, protocol: REST, criticality: conditional, inputFrom: authoritative issued ticket evidence, outputTo: ticket cancellation evidence, timeoutClass: ticketCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue, onFailure: COMPENSATION_PENDING, compensation: retry-by-policy}
      - {<<: *paymentGet, step: 5, service: payment-service, protocol: REST, criticality: conditional, inputFrom: booking.paymentId, outputTo: authoritative payment evidence, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: refund only verified captured/refundable amount, onFailure: COMPENSATION_PENDING when payment evidence is required, compensation: none}
      - {<<: *paymentRefund, step: 6, service: payment-service, protocol: REST, criticality: conditional, inputFrom: verified captured payment evidence, outputTo: refund evidence, timeoutClass: paymentCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue, onFailure: COMPENSATION_PENDING or reconciliation on unknown, compensation: reconciliation}
      - {<<: *seatGetReservation, step: 7, service: seat-inventory-service, protocol: SOAP, criticality: conditional, inputFrom: booking.reservationId plus correlation/caller/schemaVersion, outputTo: authoritative reservation state, timeoutClass: read, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: release only if allowed, onFailure: COMPENSATION_PENDING when release evidence is required, compensation: none}
      - {<<: *seatRelease, step: 8, service: seat-inventory-service, protocol: SOAP, criticality: conditional, inputFrom: releasable reservation evidence plus stable key, outputTo: release evidence, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue, onFailure: COMPENSATION_PENDING, compensation: retry-by-policy}
      - {<<: *bookingCancel, step: 9, service: booking-service, protocol: REST, criticality: critical, inputFrom: cancellation reason and all required compensation evidence, outputTo: CANCELLED or COMPENSATION_PENDING, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: public-workflow-key, onSuccess: return authoritative state, onFailure: retain compensation evidence, compensation: none}
    timeoutPolicy: evidence reads plus bounded idempotent compensation commands
    retryPolicy: no blind retry; compensation commands require stable keys; payment ambiguity reconciles
    idempotencyPolicy: one cancellation workflow per Idempotency-Key and request hash
    errorMappings: [REST_PROVIDER_ERROR, SOAP_FAULT, TIMEOUT, CONNECTION_FAILURE, CIRCUIT_OPEN, INVALID_PROVIDER_RESPONSE]
    workflowResult: CANCELLED only when all required refund/release/ticket evidence is complete; otherwise COMPENSATION_PENDING.

  - publicOperationId: aggregateHealth
    method: GET
    path: /api/health
    authentication: none
    authorization: public shallow health
    requiredHeaders: []
    acceptedHeaders: []
    generatedHeaders: [X-Correlation-ID]
    security: []
    requestSchema: null
    responseSchemas:
      '200': '#/paths/~1api~1health/get/responses/200/content/application~1json/schema'
      '503': '#/components/schemas/ErrorResponse'
    providerCalls: []
    timeoutPolicy: read
    retryPolicy: none
    idempotencyPolicy: naturally-idempotent
    errorMappings: [INVALID_PROVIDER_RESPONSE]
    workflowResult: Shallow process health only; dependency readiness is an implementation note and adds no response fields.

  - publicOperationId: getWorkflowTrace
    method: GET
    path: /api/traces/{correlationId}
    authentication: UserJwt required
    authorization: operations/admin policy in ESB
    requiredHeaders: []
    acceptedHeaders: []
    generatedHeaders: [X-Correlation-ID]
    security: [UserJwt]
    requestSchema: path.correlationId
    responseSchemas:
      '200': '#/paths/~1api~1traces~1{correlationId}/get/responses/200/content/application~1json/schema'
      '403': '#/components/schemas/ErrorResponse'
      '404': '#/components/schemas/ErrorResponse'
    providerCalls: []
    timeoutPolicy: read
    retryPolicy: safeRead
    idempotencyPolicy: naturally-idempotent
    errorMappings: [TIMEOUT, INVALID_PROVIDER_RESPONSE]
    workflowResult: Read future ESB TraceRepository only; never read provider databases and do not claim distributed tracing exists.

  - publicOperationId: issueRealtimeWebSocketTicket
    method: POST
    path: /api/realtime/ws-tickets
    authentication: UserJwt required
    authorization: Booking access decision from verified JWT sub and roles
    requiredHeaders: []
    acceptedHeaders: [X-Correlation-ID, traceparent]
    generatedHeaders: [X-Correlation-ID]
    security: [UserJwt]
    requestSchema: '#/components/schemas/WsTicketRequest'
    responseSchemas:
      '201': '#/components/schemas/WsTicketResponse'
      '400': '#/components/schemas/ErrorResponse'
      '401': '#/components/schemas/ErrorResponse'
      '403': '#/components/schemas/ErrorResponse'
      '429': '#/components/schemas/ErrorResponse'
      '503': '#/components/schemas/ErrorResponse'
    providerCalls:
      - {<<: *bookingAccess, step: 1, service: booking-service, protocol: INTERNAL_REST, criticality: critical, inputFrom: request.bookingId plus verifiedJwt.sub/roles, outputTo: allowed decision, timeoutClass: internalDecision, retryClass: safeRead, idempotency: naturally-idempotent, onSuccess: issue only if allowed, onFailure: deny and issue no ticket, compensation: none}
    timeoutPolicy: internalDecision
    retryPolicy: safeRead
    idempotencyPolicy: unique jti per successful issuance; no ticket refresh
    errorMappings: [REST_PROVIDER_ERROR, TIMEOUT, CONNECTION_FAILURE, CIRCUIT_OPEN, INVALID_PROVIDER_RESPONSE]
    workflowResult: Signed JWT/JWS with iss=booking-orchestrator, aud=realtime-status-service, verified sub, bookingId, scope=booking:status:read, iat, exp, unique jti and TTL <= 60 seconds; no query-token flow.

workflowDefinitions:
  bookingCreation:
    requiredStateEvidence: [PENDING, SEAT_RESERVED, PAYMENT_PROCESSING, CONFIRMED, FAILED, COMPENSATION_PENDING]
    ordering: [identity_mapping, active_customer, event_and_price, CheckAvailability, createBooking, ReserveSeats, bookingReservation, createPayment, bookingPaymentStarted, authorizePayment, capturePayment, bookingPaymentResult, issueTickets, bookingTickets, ConfirmSeats, bookingConfirm]
    sourceOfAuthority: contracts/**
    derivedDesignOnly: true
    failureRules:
      createBookingFailure: Stop immediately; no reservation exists and no compensation is scheduled.
      reserveSeatsDeterminedFailure: Record bookingFail; do not create Payment or Ticket and do not call ReleaseSeats.
      reserveSeatsUnknown: Replay ReserveSeats within the remaining deadline using the identical bookingId, eventId, seatIds, ttlSeconds, RequestContext and idempotency key. Never create a new key or payload. If bounded replay remains unknown, keep Booking PENDING and schedule replay/reconciliation with that same key; do not call GetReservation without a known reservationId.
      bookingReservationFailure: After a successful reserve, call ReleaseSeats then bookingFail; use COMPENSATION_PENDING until release evidence is complete.
      paymentUnknown: Do not issue Ticket, ConfirmSeats, bookingConfirm or unsafe ReleaseSeats; persist UNKNOWN and use reconcilePayment.
    CAPTURED: Ticket issue then ticket evidence then seat confirmation; Booking CONFIRMED requires payment+seat+ticket evidence.
    DECLINED_OR_FAILED: No ticket; ReleaseSeats; persist Booking FAILED and compensation evidence; normalized failure.
    UNKNOWN: No booking confirm, no ticket issue, no unsafe seat release; persist evidence; return 202 and use reconcilePayment.
    afterCaptureFailure: Persist COMPENSATION_PENDING; refund/ticket cancellation/seat release remain evidence-driven idempotent compensations.
    branchProviderCalls:
      reserveSeatsDeterminedFailure:
        - {<<: *bookingFail, step: reserve-failed-1, service: booking-service, protocol: REST, criticality: critical, inputFrom: createBooking.output.bookingId plus determined ReserveSeats failure evidence, outputTo: Booking FAILED, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: return normalized reservation failure, onFailure: retain pending workflow evidence, compensation: none}
      reserveSeatsUnknown:
        - {<<: *seatReserve, step: reserve-unknown-replay, service: seat-inventory-service, protocol: SOAP, criticality: reconciliation, inputFrom: exact original ReserveSeats request containing unchanged createBooking.output.bookingId/eventId/seatIds/ttlSeconds/RequestContext and the same stable-workflow-step-key, outputTo: same recorded reservation or unresolved outcome, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: same-stable-workflow-step-key, onSuccess: use recorded reservationId then continue to bookingReservation; GetReservation is allowed only after reservationId is known, onFailure: after bounded same-key replay and remaining-deadline exhaustion keep Booking PENDING and schedule replay/reconciliation with the same key; no Payment/Ticket/ConfirmSeats/bookingConfirm/ReleaseSeats, compensation: none}
      bookingReservationFailure:
        - {<<: *seatRelease, step: reservation-evidence-failure-1, service: seat-inventory-service, protocol: SOAP, criticality: compensation, inputFrom: successful reservation evidence plus stable compensation key, outputTo: release evidence, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: record bookingFail with completed compensation, onFailure: record bookingFail as COMPENSATION_PENDING, compensation: retry-by-policy}
        - {<<: *bookingFail, step: reservation-evidence-failure-2, service: booking-service, protocol: REST, criticality: critical, inputFrom: bookingId plus reservation/release evidence, outputTo: FAILED or COMPENSATION_PENDING, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: return normalized failure, onFailure: retain workflow evidence, compensation: none}
      paymentFailed:
        - {<<: *seatRelease, step: failure-1, service: seat-inventory-service, protocol: SOAP, criticality: compensation, inputFrom: reservation evidence plus stable key, outputTo: release evidence, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue failure recording, onFailure: COMPENSATION_PENDING, compensation: retry-by-policy}
        - {<<: *bookingFail, step: failure-2, service: booking-service, protocol: REST, criticality: critical, inputFrom: payment failure plus release evidence, outputTo: FAILED or COMPENSATION_PENDING, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: return normalized failure, onFailure: retain workflow evidence, compensation: none}
      paymentUnknown:
        - {<<: *paymentReconcile, step: unknown-1, service: payment-service, protocol: REST, criticality: reconciliation, inputFrom: paymentId and ambiguous provider evidence, outputTo: verified eventual outcome, timeoutClass: paymentCommand, retryClass: reconciliationOnly, idempotency: stable-reconciliation-key, onSuccess: resume evidence-driven workflow, onFailure: remain PAYMENT_PROCESSING, compensation: none}
      afterCaptureFailure:
        - {<<: *ticketCancel, step: captured-failure-1, service: ticket-service, protocol: REST, criticality: conditional-compensation, inputFrom: any issued ticket evidence, outputTo: ticket cancellation evidence, timeoutClass: ticketCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue, onFailure: COMPENSATION_PENDING, compensation: retry-by-policy}
        - {<<: *paymentRefund, step: captured-failure-2, service: payment-service, protocol: REST, criticality: compensation, inputFrom: captured payment evidence, outputTo: refund evidence, timeoutClass: paymentCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue, onFailure: COMPENSATION_PENDING or reconciliation, compensation: reconciliation}
        - {<<: *seatRelease, step: captured-failure-3, service: seat-inventory-service, protocol: SOAP, criticality: conditional-compensation, inputFrom: releasable reservation evidence, outputTo: release evidence, timeoutClass: seatCommand, retryClass: idempotentCommand, idempotency: stable-compensation-key, onSuccess: continue, onFailure: COMPENSATION_PENDING, compensation: retry-by-policy}
        - {<<: *bookingFail, step: captured-failure-4, service: booking-service, protocol: REST, criticality: critical, inputFrom: captured evidence plus compensation evidence, outputTo: COMPENSATION_PENDING until complete, timeoutClass: bookingCommand, retryClass: idempotentCommand, idempotency: stable-workflow-step-key, onSuccess: expose authoritative state, onFailure: retain workflow evidence, compensation: none}
  cancellation:
    ordering: [access_decision, booking_get, evidence_reads, ticket_cancel_if_issued, refund_if_captured, release_if_releasable, booking_cancel]
    completion: CANCELLED only after all required compensation evidence; otherwise COMPENSATION_PENDING.
  sideEffects:
    notification: {criticalPath: false, bookingRollbackOnFailure: false, transportDecision: deferred}
    realtime: {criticalPath: false, bookingRollbackOnFailure: false, transportDecision: direct contract call allowed; no new queue decision}
