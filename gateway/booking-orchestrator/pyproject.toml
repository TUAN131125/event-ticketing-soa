[project]
name='event-ticketing-esb'
version='2.2.0'
requires-python='>=3.12'
[tool.pytest.ini_options]
asyncio_mode='auto'
pythonpath=['.']
[tool.ruff]
line-length=140
target-version='py312'
[tool.ruff.lint]
select=['E','F','I','B','UP']
ignore=['E501']
[tool.mypy]
python_version='3.12'
strict=true
exclude=['tests']
