name: event-ticketing-soa

x-backend: &backend
  restart: unless-stopped
  env_file:
    - .env.example
    - path: .env
      required: false
  networks:
    - event-ticketing
  volumes:
    - ./local-secrets:/run/secrets:ro

x-migration: &migration
  restart: "no"
  env_file:
    - .env.example
    - path: .env
      required: false
  networks:
    - event-ticketing
  depends_on:
    postgres:
      condition: service_healthy
  entrypoint:
    - alembic
  command:
    - upgrade
    - head
  healthcheck:
    disable: true

x-identity-image: &identity-image
  image: event-ticketing/identity:local
  build:
    context: .
    dockerfile: services/identity-service/Dockerfile

x-customer-image: &customer-image
  image: event-ticketing/customer:local
  build:
    context: .
    dockerfile: services/customer-service/Dockerfile

x-event-image: &event-image
  image: event-ticketing/event:local
  build:
    context: .
    dockerfile: services/event-service/Dockerfile

x-seat-image: &seat-image
  image: event-ticketing/seat:local
  build:
    context: .
    dockerfile: services/seat-inventory-service/Dockerfile

x-booking-image: &booking-image
  image: event-ticketing/booking:local
  build:
    context: .
    dockerfile: services/booking-service/Dockerfile

x-payment-image: &payment-image
  image: event-ticketing/payment:local
  build:
    context: .
    dockerfile: services/payment-service/Dockerfile

x-ticket-image: &ticket-image
  image: event-ticketing/ticket:local
  build:
    context: .
    dockerfile: services/ticket-service/Dockerfile

x-notification-image: &notification-image
  image: event-ticketing/notification:local
  build:
    context: .
    dockerfile: services/notification-service/Dockerfile

x-orchestrator-image: &orchestrator-image
  image: event-ticketing/orchestrator:local
  build:
    context: .
    dockerfile: gateway/booking-orchestrator/Dockerfile

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped

    ports:
      - "127.0.0.1:5433:5432"

    env_file:
      - .env.example
      - path: .env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init/00-create-databases.sh:/docker-entrypoint-initdb.d/00-create-databases.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - event-ticketing

  identity-migrate:
    <<: [*migration, *identity-image]
    profiles: [all, backend, identity]
    environment:
      IDENTITY_PRIVATE_KEY_FILE: ""
      IDENTITY_PRIVATE_KEY_BASE64: ""
      IDENTITY_PUBLIC_KEY_FILE: ""
      IDENTITY_PUBLIC_KEY_BASE64: ""

  identity:
    <<: [*backend, *identity-image]
    profiles: [all, backend, identity]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    ports:
      - "8009:8009"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8009/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  customer-migrate:
    <<: [*migration, *customer-image]
    profiles: [all, backend, customer]

  customer:
    <<: [*backend, *customer-image]
    profiles: [all, backend, customer]
    depends_on:
      customer-migrate:
        condition: service_completed_successfully
    ports:
      - "8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  event-migrate:
    <<: [*migration, *event-image]
    profiles: [all, backend, event]

  event:
    <<: [*backend, *event-image]
    profiles: [all, backend, event]
    depends_on:
      event-migrate:
        condition: service_completed_successfully
    ports:
      - "8002:8002"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  seat-migrate:
    <<: [*migration, *seat-image]
    profiles: [all, backend, seat]

  seat:
    <<: [*backend, *seat-image]
    profiles: [all, backend, seat]
    depends_on:
      seat-migrate:
        condition: service_completed_successfully
    ports:
      - "8003:8003"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  booking-migrate:
    <<: [*migration, *booking-image]
    profiles: [all, backend, booking]

  booking:
    <<: [*backend, *booking-image]
    profiles: [all, backend, booking]
    depends_on:
      booking-migrate:
        condition: service_completed_successfully
    ports:
      - "8004:8004"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  payment-migrate:
    <<: [*migration, *payment-image]
    profiles: [all, backend, payment]

  payment:
    <<: [*backend, *payment-image]
    profiles: [all, backend, payment]
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
    ports:
      - "8005:8005"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  ticket-migrate:
    <<: [*migration, *ticket-image]
    profiles: [all, backend, ticket]

  ticket:
    <<: [*backend, *ticket-image]
    profiles: [all, backend, ticket]
    depends_on:
      ticket-migrate:
        condition: service_completed_successfully
    ports:
      - "8006:8006"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  notification-migrate:
    <<: [*migration, *notification-image]
    profiles: [all, backend, notification]

  notification:
    <<: [*backend, *notification-image]
    profiles: [all, backend, notification]
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
    ports:
      - "8007:8007"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  orchestrator-migrate:
    <<: [*migration, *orchestrator-image]
    profiles: [all, backend, orchestrator]

  orchestrator:
    <<: [*backend, *orchestrator-image]
    profiles: [all, backend, orchestrator]
    depends_on:
      orchestrator-migrate:
        condition: service_completed_successfully
      identity:
        condition: service_healthy
      customer:
        condition: service_healthy
      event:
        condition: service_healthy
      seat:
        condition: service_healthy
      booking:
        condition: service_healthy
      payment:
        condition: service_healthy
      ticket:
        condition: service_healthy
      notification:
        condition: service_healthy
      realtime:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  # One-shot local/demo provisioning. It is deliberately outside the `all` profile so
  # neither `docker compose up` nor any migration can trigger it implicitly.
  seed-local:
    <<: *orchestrator-image
    profiles: [seed]
    restart: "no"
    env_file:
      - .env.example
      - path: .env
        required: false
    networks:
      - event-ticketing
    volumes:
      - ./local-secrets:/run/secrets:ro
      - ./scripts/seed_local.py:/app/seed_local.py:ro
    depends_on:
      event:
        condition: service_healthy
      seat:
        condition: service_healthy
    healthcheck:
      disable: true
    entrypoint:
      - python
      - /app/seed_local.py

  realtime:
    <<: *backend
    image: event-ticketing/realtime:local
    build:
      context: .
      dockerfile: services/realtime-status-service/Dockerfile
    profiles: [all, backend, realtime]
    ports:
      - "8008:8008"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8008/health/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # The browser is the client, so these URLs are the ones it can reach from the host, not
  # in-network service names. They are baked in at build time by Vite and never hardcoded
  # in the source.
  customer-web:
    image: event-ticketing/customer-web:local
    build:
      context: ./frontend
      dockerfile: customer-web/Dockerfile
      args:
        # Compose interpolation reads the shell and `.env`, not `env_file`, so the local
        # defaults live here and stay overridable per environment. The ESB origin is the
        # only browser-reachable URL: Identity and Realtime are behind the ESB façade.
        VITE_ESB_API_URL: ${VITE_ESB_API_URL:-http://localhost:8000}
    profiles: [all, frontend]
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - event-ticketing
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  admin-web:
    image: event-ticketing/admin-web:local
    build:
      context: ./frontend
      dockerfile: admin-web/Dockerfile
      args:
        # Compose interpolation reads the shell and `.env`, not `env_file`, so the local
        # defaults live here and stay overridable per environment. The ESB origin is the
        # only browser-reachable URL: Identity and Realtime are behind the ESB façade.
        VITE_ESB_API_URL: ${VITE_ESB_API_URL:-http://localhost:8000}
    profiles: [all, frontend]
    restart: unless-stopped
    ports:
      - "3001:80"
    networks:
      - event-ticketing
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1/health
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres-data:

networks:
  event-ticketing:
    driver: bridge
