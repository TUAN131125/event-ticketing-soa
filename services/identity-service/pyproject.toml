[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "event-ticketing-identity"
version = "1.0.0"
description = "Security-critical Identity and Access Service"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "argon2-cffi==25.1.0",
  "cryptography==49.0.0",
  "email-validator==2.2.0",
  "fastapi==0.141.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "PyJWT==2.13.0",
  "PyYAML==6.0.2",
  "starlette==1.3.1",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101", "S105", "S106", "S107"]
"scripts/generate_keys.py" = ["S501"]
"app/api/v1/*.py" = ["B008"]
"app/dependencies.py" = ["B008"]
"app/domain/enums.py" = ["S105"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL database",
  "concurrency: exercises PostgreSQL row locks with multiple threads",
  "security: validates authentication and transport hardening",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "jwt.*", "argon2.*"]
ignore_missing_imports = true
