name: notification-service

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: notification_service
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: notification_service
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service -d notification_service"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data

  notification-service:
    build:
      context: .
    environment:
      NOTIFICATION_APP_ENV: local
      NOTIFICATION_DATABASE_URL: postgresql+psycopg://notification_service:notification_service@postgres:5432/notification_service
      # NOT-02: doi gia tri that, phai KHOP voi bi mat ben ESB dung de ky.
      NOTIFICATION_WEBHOOK_SHARED_SECRET: dev-only-shared-secret-change-me
      # RS256 public key cua Identity Service - xem ./keys/README (chua co,
      # can nhom Identity chia se file public key that de mount vao day).
      NOTIFICATION_JWT_PUBLIC_KEY_PATH: /app/keys/identity-public.pem
      NOTIFICATION_JWT_ISSUER: identity-service
      NOTIFICATION_JWT_AUDIENCE: event-ticketing-soa
    volumes:
      - ./keys:/app/keys:ro
    ports:
      - "8007:8007"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  notification-postgres-data:
