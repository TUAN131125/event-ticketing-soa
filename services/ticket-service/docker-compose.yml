name: ticket-service

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ticket
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "5439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - ticket-postgres-data:/var/lib/postgresql/data

  ticket-service:
    build:
      context: .
    environment:
      TICKET_APP_ENV: local
      TICKET_DATABASE_URL: postgresql+psycopg://ticket:ticket@postgres:5432/ticket
      TICKET_SERVICE_TOKEN: local-development-token
      TICKET_QR_SIGNING_KEY: local-development-qr-signing-key
      TICKET_WEB_WORKERS: "1"
    ports:
      - "8006:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  ticket-postgres-data:
