name: ticket-service-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ticket_test
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
    ports:
      - "55436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket -d ticket_test"]
      interval: 2s
      timeout: 3s
      retries: 30
