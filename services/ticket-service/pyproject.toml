[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "event-ticketing-ticket-service"
version = "1.0.0"
description = "Transaction-safe digital ticket issuance and check-in service"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.16.5",
  "fastapi==0.116.1",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.9",
  "pydantic==2.11.7",
  "qrcode==8.2",
  "SQLAlchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S101", "S105", "S106"]
"app/api/v1/*.py" = ["B008"]
"app/middleware/authentication.py" = ["B008"]
"app/middleware/logging.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "integration: requires a real PostgreSQL database",
  "concurrency: exercises PostgreSQL locks with multiple threads",
  "security: validates authentication, authorization and QR hardening",
]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["prometheus_client.*", "qrcode.*"]
ignore_missing_imports = true
