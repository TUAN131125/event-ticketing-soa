name: seat-inventory-test

services:
  postgres-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: seat_inventory_test
      POSTGRES_USER: seat_inventory
      POSTGRES_PASSWORD: seat_inventory
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seat_inventory -d seat_inventory_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
