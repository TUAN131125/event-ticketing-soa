name: customer-service

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: customer_service
      POSTGRES_USER: customer_service
      POSTGRES_PASSWORD: customer_service
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_service -d customer_service"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - customer-postgres-data:/var/lib/postgresql/data

  customer-service:
    build:
      context: .
    environment:
      CUSTOMER_APP_ENV: local
      CUSTOMER_DATABASE_URL: postgresql+psycopg://customer_service:customer_service@postgres:5432/customer_service
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  customer-postgres-data:
