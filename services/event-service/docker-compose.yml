name: event-service

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: event_service
      POSTGRES_PASSWORD: event_service
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_service -d event_service"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - event-postgres-data:/var/lib/postgresql/data

  event-service:
    build:
      context: .
    environment:
      EVENT_APP_ENV: local
      EVENT_DATABASE_URL: postgresql+psycopg://event_service:event_service@postgres:5432/event_service
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  event-postgres-data:
