name: booking-service-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: booking_test
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking_test"]
      interval: 2s
      timeout: 3s
      retries: 30
