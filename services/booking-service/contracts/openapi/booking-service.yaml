            $ref: '#/components/schemas/BookingResponse'
          type: array
          title: Items
        page:
          type: integer
          title: Page
        pageSize:
          type: integer
          title: Pagesize
        total:
          type: integer
          title: Total
        totalPages:
          type: integer
          title: Totalpages
      additionalProperties: false
      type: object
      required:
      - items
      - page
      - pageSize
