components:
  schemas:
    AttachReservationRequest:
      properties:
        reservationId:
          type: string
          maxLength: 128
          minLength: 1
          title: Reservationid
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expectedversion
        reservationVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Reservationversion
        reservationExpiresAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Reservationexpiresat
        confirmed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Confirmed
        evidence:
          anyOf:
          - $ref: '#/components/schemas/EvidenceRequest'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - reservationId
      title: AttachReservationRequest
    AttachTicketsRequest:
      properties:
        ticketIds:
          items:
            type: string
          type: array
          maxItems: 50
          minItems: 1
          title: Ticketids
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expectedversion
        evidence:
          anyOf:
          - $ref: '#/components/schemas/EvidenceRequest'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - ticketIds
      title: AttachTicketsRequest
    BookingHistoryEntryResponse:
      properties:
        operation:
          type: string
          title: Operation
        previousStatus:
          anyOf:
          - type: string
          - type: 'null'
          title: Previousstatus
        newStatus:
          type: string
          title: Newstatus
        callerService:
          type: string
          title: Callerservice
        actorId:
          anyOf:
          - type: string
          - type: 'null'
          title: Actorid
        correlationId:
          type: string
          title: Correlationid
        idempotencyKey:
          type: string
          title: Idempotencykey
        resourceVersion:
          type: integer
          title: Resourceversion
        details:
          additionalProperties: true
          type: object
          title: Details
        occurredAt:
          type: string
          format: date-time
          title: Occurredat
      additionalProperties: false
      type: object
      required:
      - operation
      - previousStatus
      - newStatus
      - callerService
      - correlationId
      - idempotencyKey
      - resourceVersion
      - details
      - occurredAt
      title: BookingHistoryEntryResponse
    BookingHistoryResponse:
      properties:
        bookingId:
          type: string
          title: Bookingid
        items:
          items:
            $ref: '#/components/schemas/BookingHistoryEntryResponse'
          type: array
          title: Items
      additionalProperties: false
      type: object
      required:
      - bookingId
      - items
      title: BookingHistoryResponse
    BookingItemRequest:
      properties:
        seatId:
          type: string
          maxLength: 128
          minLength: 1
          title: Seatid
        ticketType:
          type: string
          maxLength: 128
          minLength: 1
          title: Tickettype
        unitPrice:
          anyOf:
          - type: number
            minimum: 0.0
          - type: string
          title: Unitprice
        priceCurrency:
          anyOf:
          - type: string
            maxLength: 3
            minLength: 3
          - type: 'null'
          title: Pricecurrency
      additionalProperties: false
      type: object
      required:
      - seatId
      - ticketType
      - unitPrice
      title: BookingItemRequest
    BookingItemResponse:
      properties:
        seatId:
          type: string
          title: Seatid
        ticketType:
          type: string
          title: Tickettype
        ticketTypeCode:
          type: string
          title: Tickettypecode
        unitPrice:
          type: string
          title: Unitprice
      additionalProperties: false
      type: object
      required:
      - seatId
      - ticketType
      - ticketTypeCode
      - unitPrice
      title: BookingItemResponse
    BookingPageResponse:
      properties:
        items:
