name: booking-service

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - booking-postgres-data:/var/lib/postgresql/data

  booking-service:
    build:
      context: .
    environment:
      BOOKING_APP_ENV: local
      BOOKING_DATABASE_URL: postgresql+psycopg://booking:booking@postgres:5432/booking
      BOOKING_SERVICE_TOKEN: local-development-token
      BOOKING_WEB_WORKERS: "1"
    ports:
      - "8004:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  booking-postgres-data:
