openapi: 3.1.0
info:
  title: Payment Service
  description: Internal provider-neutral payment ledger. Raw card credentials are
    not accepted by this API.
  version: 1.0.0
paths:
  /health/live:
    get:
      tags:
      - health
      summary: Live
      operationId: paymentLiveness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Paymentliveness
  /health/ready:
    get:
      tags:
      - health
      summary: Ready
      operationId: paymentReadiness
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /payments/provider-callback:
    post:
      tags:
      - provider-callback
      summary: Provider Callback
      operationId: handleProviderCallback
      parameters:
      - name: X-Webhook-Timestamp
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Webhook-Timestamp
      - name: X-Webhook-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Webhook-Signature
      - name: X-Provider-Timestamp
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Legacy alias for X-Webhook-Timestamp.
          title: X-Provider-Timestamp
        description: Legacy alias for X-Webhook-Timestamp.
      - name: X-Provider-Signature
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Legacy alias for X-Webhook-Signature.
          title: X-Provider-Signature
        description: Legacy alias for X-Webhook-Signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderCallbackRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '401':
          description: Signature or timestamp is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Duplicate event or invalid payment transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments:
    post:
      tags:
      - payments
      summary: Create
      operationId: createPayment
      security:
      - serviceToken: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - payments
      summary: List All
      operationId: listPayments
      security:
      - serviceToken: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Pagesize
      - name: bookingId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bookingid
      - name: customerId
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Customerid
      - name: provider
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 40
          - type: 'null'
          title: Provider
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
          title: Status
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          title: Search
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}:
    get:
      tags:
      - payments
      summary: Get
      operationId: getPayment
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/refunds:
    get:
      tags:
      - payments
      summary: Refunds
      operationId: listPaymentRefunds
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - payment-commands
      summary: Refund Canonical
      description: Canonical Stage 3/5 refund command path.
      operationId: createPaymentRefund
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/provider-events:
    get:
      tags:
      - payments
      summary: Provider Events
      operationId: listPaymentProviderEvents
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderEventListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/authorize:
    post:
      tags:
      - payment-commands
      summary: Authorize
      operationId: authorizePayment
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizePaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '202':
          description: Provider outcome is UNKNOWN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: Provider declined the payment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: State, version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/capture:
    post:
      tags:
      - payment-commands
      summary: Capture
      operationId: capturePayment
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CapturePaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '202':
          description: Provider outcome is UNKNOWN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '402':
          description: Provider declined capture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: State, version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/cancel:
    post:
      tags:
      - payment-commands
      summary: Cancel
      operationId: cancelPayment
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelPaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/refund:
    post:
      tags:
      - payment-commands
      summary: Refund Legacy
      description: Legacy path retained for existing ESB consumers.
      operationId: refundPayment
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundPaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /payments/{payment_id}/reconcile:
    post:
      tags:
      - payment-commands
      summary: Reconcile
      operationId: reconcilePayment
      security:
      - serviceToken: []
      parameters:
      - name: payment_id
        in: path
        required: true
        schema:
          type: string
          title: Payment Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 128
          title: Idempotency-Key
      - name: If-Match
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: If-Match
      - name: X-Caller-Service
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Caller-Service
      - name: X-Actor-ID
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Actor-Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcilePaymentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentResponse'
        '409':
          description: State, version or idempotency conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Provider outcome is unavailable; retry after backoff.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AuthorizePaymentRequest:
      properties:
        approved:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Approved
        providerStatus:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
        providerReference:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Providerreference
        failureCode:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Failurecode
        reason:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Reason
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expectedversion
      additionalProperties: false
      type: object
      title: AuthorizePaymentRequest
    BookingPaymentEvidenceRequest:
      properties:
        bookingId:
          type: string
          maxLength: 128
          minLength: 1
          title: Bookingid
        customerId:
          type: string
          maxLength: 128
          minLength: 1
          title: Customerid
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
          - type: 'null'
          title: Amount
        amountMinor:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Amountminor
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        resourceVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Resourceversion
        evidenceId:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Evidenceid
      additionalProperties: false
      type: object
      required:
      - bookingId
      - customerId
      - currency
      title: BookingPaymentEvidenceRequest
    CancelPaymentRequest:
      properties:
        reason:
          type: string
          maxLength: 2000
          minLength: 1
          title: Reason
        providerReference:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Providerreference
        providerStatus:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expectedversion
      additionalProperties: false
      type: object
      required:
      - reason
      title: CancelPaymentRequest
    CapturePaymentRequest:
      properties:
        succeeded:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Succeeded
        providerStatus:
          anyOf:
          - $ref: '#/components/schemas/PaymentStatus'
          - type: 'null'
        providerReference:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Providerreference
        failureCode:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Failurecode
        reason:
          anyOf:
          - type: string
            maxLength: 2000
            minLength: 1
          - type: 'null'
          title: Reason
        expectedVersion:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Expectedversion
      additionalProperties: false
      type: object
      title: CapturePaymentRequest
    CreatePaymentRequest:
      properties:
        bookingId:
          type: string
          maxLength: 128
          minLength: 1
          title: Bookingid
        customerId:
          type: string
          maxLength: 128
          minLength: 1
          title: Customerid
        amount:
          anyOf:
          - type: number
            exclusiveMinimum: 0.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*(?:\d{0,16}|(?=[\d.]{1,19}0*$)\d{0,16}\.\d{0,2}0*$)
          - type: 'null'
          title: Amount
        amountMinor:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Amountminor
        currency:
          type: string
          maxLength: 3
          minLength: 3
          title: Currency
        paymentMethod:
          anyOf:
          - type: string
            maxLength: 40
            minLength: 1
          - type: 'null'
          title: Paymentmethod
        methodToken:
          anyOf:
          - type: string
            maxLength: 256
            minLength: 8
          - type: 'null'
          title: Methodtoken
        provider:
          type: string
          maxLength: 40
          minLength: 1
          title: Provider
          default: mock-provider
        bookingEvidence:
          anyOf:
          - $ref: '#/components/schemas/BookingPaymentEvidenceRequest'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - bookingId
      - customerId
      - currency
      title: CreatePaymentRequest
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
        details:
          additionalProperties: true
          type: object
          title: Details
      additionalProperties: false
      type: object
      required:
      - code
      - message
      - retryable
      title: ErrorDetail
    ErrorEnvelope:
      properties:
        correlationId:
          type: string
          title: Correlationid
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - correlationId
      - error
      title: ErrorEnvelope
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
