name: payment-service-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: payment_test
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment
    ports:
      - "55435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_test"]
      interval: 2s
      timeout: 3s
      retries: 30
